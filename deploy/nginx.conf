server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;
    location = /cv { return 301 /cv/; }
    location = /cv/ru { return 301 /cv/ru/; }
    # Agent series posts renamed when the blog moved to series.
    rewrite ^/blog/((?:ru/)?)agent-1-first-call/?$ /blog/$1agent-first-call/ permanent;
    rewrite ^/blog/((?:ru/)?)agent-2-agent-loop/?$ /blog/$1agent-loop/ permanent;
    rewrite ^(/blog(?:/[^.]*[^/])?)$ $1/ permanent;
    location / { try_files $uri $uri/ =404; }
}
