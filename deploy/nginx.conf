# Stylesheets and scripts linked with ?v=<content hash> (scripts/build.ts) never
# change under that URL, so browsers keep them; pages and data revalidate.
map $uri $cache_kind {
    ~*\.(?:css|js)$ asset;
    ~*\.woff2$ font;
    ~*\.(?:svg|png|jpe?g|webp|mp4)$ media;
    default page;
}
map "$cache_kind:$arg_v" $cache_control {
    ~^asset:. "public, max-age=31536000, immutable";
    ~^font: "public, max-age=2592000";
    ~^media: "public, max-age=86400";
    default "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml application/atom+xml image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control $cache_control always;
    location = /cv { return 301 /cv/; }
    location = /news { return 301 /news/; }
    location = /cv/ru { return 301 /cv/ru/; }
    # Agent series posts renamed when the blog moved to series.
    rewrite ^/blog/((?:ru/)?)agent-1-first-call/?$ /blog/$1agent-first-call/ permanent;
    rewrite ^/blog/((?:ru/)?)agent-2-agent-loop/?$ /blog/$1agent-loop/ permanent;
    rewrite ^(/blog(?:/[^.]*[^/])?)$ $1/ permanent;
    location / { try_files $uri $uri/ =404; }
}
