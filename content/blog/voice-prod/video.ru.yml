context: Голосовой агент · 7/7
scenes:
  - type: title
    kicker: Голосовой агент · часть 7
    title: "В прод: *дёшево и бережно*"
    subtitle: Нагрузка, цена минуты и персональные данные.

  - type: statement
    label: Нагрузка
    text: Четыреста звонков в день это *несколько разговоров* в пик.
    say: Хватает двух небольших машин. Вторая не для мощности, а чтобы не терять звонки.

  - type: list
    label: Цена минуты
    heading: Из чего складывается
    items:
      - "*Телефония*: как и для людей"
      - "*Распознавание*: минуты речи клиента"
      - "*Модель*: дёшево с кэшем"
      - "*Синтез*: часто самое дорогое"

  - type: list
    label: Данные
    heading: Записи это персональные данные
    items:
      - "Предупреждение *о записи*"
      - "Звук *тридцать дней*"
      - "Номера *замаскированы*"
      - "Доступ *по списку*"

  - type: statement
    label: Главное правило
    text: При любом сбое звонок уходит *людям, а не в тишину*.

  - type: list
    label: Итоги
    heading: Весь цикл за семь шагов
    numbered: true
    items:
      - Где окупается и бюджет задержки
      - Потоковый каскад
      - Конец реплики и перебивания
      - SIP и перевод с пересказом
      - Инструменты и подтверждение
      - Симуляция и разбор
      - Прод, деньги и данные

  - type: end
    text: Цикл готов. Агент берёт рутину, *люди сложное*.
    url: balkhaev.com/blog/ru/voice-prod
