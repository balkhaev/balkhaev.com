context: Корпоративный AI-агент · 8/9
scenes:
  - type: title
    kicker: Корпоративный AI-агент · часть 8
    title: "Интерфейс: *веб-чат и бот в Slack*"
    subtitle: Выносим агента из терминала, с входом через SSO.

  - type: list
    label: Требования
    heading: Что нужно от интерфейса
    items:
      - "*Знать, кто спрашивает*: вход через корпоративный SSO"
      - "*Не терять доступ посреди дня*: refresh token, аккуратно хранимый"
      - "*Показывать ответ по мере написания*"
      - "*Помнить разговоры* между сессиями"
      - "*Подтверждать опасное* кнопкой"

  - type: diagram
    label: Схема
    heading: Одно ядро, два интерфейса
    nodes:
      - { id: browser, label: Браузер, sub: веб-чат, col: 0, row: 0, w: 3, step: 0 }
      - { id: slack, label: Slack, sub: личные сообщения, col: 0, row: 3, w: 3, step: 0 }
      - { id: web, label: Веб-сервер, sub: "вход, сессии, SSE", col: 4, row: 1, w: 3, step: 1 }
      - { id: core, label: Ядро агента, sub: "цикл, кэш, лимиты", col: 8, row: 1, w: 4, step: 2, accent: true }
      - { id: store, label: Хранилище, sub: "учётки, разговоры", col: 8, row: 4, w: 4, step: 3 }
    edges:
      - { from: browser, to: web }
      - { from: slack, to: web, label: события }
      - { from: web, to: core }
      - { from: core, to: store }
    say: Ядро ничего не знает об интерфейсе и сообщает о ходе работы через колбэки. Агент создаётся на сотрудника, ход идёт один за раз, при сбое откат.

  - type: statement
    label: Вход
    text: Authorization code с *PKCE*. state защищает от подделки входа, verifier от перехвата кода.
    say: Refresh token одноразовый и хранится зашифрованным. Два одновременных обновления не должны погасить друг друга.

  - type: list
    label: Безопасность веба
    heading: Мелочи, которые важны
    items:
      - "Cookie *HttpOnly, SameSite, Secure*"
      - "*Только JSON* в POST, форма с чужого сайта не пройдёт"
      - "*Чужой разговор отвечает 404*, а не 403"
      - "Ответ модели через *textContent*, никогда через innerHTML"

  - type: list
    label: Slack
    heading: Бот в мессенджере
    items:
      - "*Проверка подписи* каждого события"
      - "*Ответ за три секунды*, работа в фоне"
      - "*Привязка аккаунта* через вход в SSO с проверкой почты"
      - "*Только личные сообщения*: ответ строится на правах спросившего"
      - "*Стриминг правкой* одного сообщения"

  - type: statement
    label: Проверено
    text: Игорь видит *только свои сделки* и в вебе, и в Slack. Чужой разговор недоступен.
    say: После перезапуска сервера бот отвечает без нового входа, токен обновляется из базы.

  - type: end
    text: Интерфейс готов. Остался последний шаг, *в прод*.
    url: balkhaev.com/blog/ru/agent-interface
