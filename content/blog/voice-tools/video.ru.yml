context: Голосовой агент · 5/7
scenes:
  - type: title
    kicker: Голосовой агент · часть 5
    title: "Действия: *записать и не ошибиться*"
    subtitle: Инструменты под голос и подтверждение перед действием.

  - type: list
    label: Инструменты
    heading: Отвечают коротко
    items:
      - "*Два окна*, а не всё расписание"
      - "Статус *одной фразой*"
      - "Ошибки *человеческим языком*"

  - type: statement
    label: Бронь
    text: Найденное окно *придерживается* на две минуты.
    say: Как билеты в кино. Пока клиент думает, окно не займёт приёмщик у стойки.

  - type: statement
    label: Перед действием
    text: "«Четверг, десять тридцать, Ленинский. *Верно?*»"

  - type: list
    label: Трудные данные
    heading: Где ошибаются чаще всего
    items:
      - "*Даты*: от текущего дня, днём недели"
      - "*Время*: переспросить «к обеду»"
      - "*Госномер*: по цифрам и марке"
      - "*Телефон*: повторить группами"
    say: Подтверждение маркой машины надёжнее любой диктовки по буквам.

  - type: list
    label: Надёжность
    heading: Когда система тормозит
    items:
      - "Фраза *перед медленным* инструментом"
      - "Тайм-аут *четыре секунды*"
      - "*Идемпотентная* запись"
      - "Подтверждение *сообщением*"

  - type: end
    text: Дальше проверяем *качество*.
    url: balkhaev.com/blog/ru/voice-tools
