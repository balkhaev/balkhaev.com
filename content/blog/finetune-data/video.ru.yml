context: Дообучение · 2/7
scenes:
  - type: title
    kicker: Дообучение · часть 2
    title: "Данные: *откуда взять* и как почистить"
    subtitle: От данных зависит почти всё качество модели.

  - type: list
    label: Задача
    heading: Обращение на входе, JSON на выходе
    items:
      - "*category*: одна из восьми категорий"
      - "*urgency*: high, normal или low"
      - "*summary*: суть одной фразой"
      - "*needs_human*: нужен ли человек"

  - type: list
    label: Источники
    heading: Откуда брать примеры
    items:
      - "*Логи с правками людей*: самое ценное"
      - "*Ручная разметка*: редкие и сложные случаи"
      - "*Большая модель-учитель*: когда своих данных мало"
    say: Каждая исправленная карточка это пример, где модель ошиблась, а человек показал, как надо.

  - type: compare
    label: Сколько нужно
    heading: Качество важнее количества
    columns:
      - title: Формат
        points:
          - 200–500 примеров
      - title: Узкий навык
        pick: true
        points:
          - 1 000–3 000 примеров
      - title: Сложный навык
        points:
          - 5 000–20 000 примеров

  - type: statement
    label: Главное правило
    text: Тест откладывают *первым* и не учат на нём никогда.
    say: Отделяйте по времени и по клиентам. Иначе модель узнаёт письмо, а не понимает его, и тест врёт.

  - type: list
    label: Чистка
    heading: Что убрать
    items:
      - "*Дубли* и почти дубли"
      - "*Противоречия*: один вход, разные ответы"
      - "*Мусор*: автоответы и рассылки"
      - "*Перекос классов*: добрать редкие"
      - "*Персональные данные*, не нужные задаче"

  - type: statement
    label: Последний шаг
    text: Прочитайте *сто примеров* глазами.
    say: Это скучно, но каждый раз находится то, чего не поймал ни один скрипт.

  - type: end
    text: Дальше первый запуск *LoRA*.
    url: balkhaev.com/blog/ru/finetune-data
