context: Корпоративный AI-агент · 3/9
scenes:
  - type: title
    kicker: Корпоративный AI-агент · часть 3
    title: Агентный цикл *и инструменты*
    subtitle: Даём модели инструменты и пишем harness, который превращает чат в агента.

  - type: statement
    label: Главное
    text: Модель не выполняет код сама. Она только *просит* вызвать функцию.
    say: Мы описываем инструменты схемой, модель отвечает просьбой вызвать один из них, мы выполняем и возвращаем результат.

  - type: diagram
    label: Цикл
    heading: Как крутится агент
    nodes:
      - { id: user, label: Пользователь, col: 0, row: 1, w: 3, step: 0 }
      - { id: model, label: Модель, sub: решает, что дальше, col: 4, row: 1, w: 4, step: 1, accent: true }
      - { id: code, label: Ваш код, sub: выполняет инструмент, col: 4, row: 4, w: 4, step: 2 }
      - { id: done, label: Ответ, col: 9, row: 1, w: 3, step: 3 }
    edges:
      - { from: user, to: model }
      - { from: model, to: code, both: true, label: tool_use / tool_result }
      - { from: model, to: done, label: end_turn }
    say: Пока модель просит инструменты, мы их выполняем и отправляем следующий запрос. Любая другая причина остановки означает, что ход закончен.

  - type: list
    label: Инструменты
    heading: Четыре инструмента учебного агента
    items:
      - "*list_files*: посмотреть папку"
      - "*read_file*: прочитать файл"
      - "*write_file*: записать файл, опасный, спрашивает разрешение"
      - "*run_command*: выполнить команду, опасный, с таймаутом"

  - type: list
    label: Решения
    heading: Что важно в инструментах
    items:
      - "Путь от модели это *недоверенный ввод*: не выпускаем за рабочую папку"
      - "*Описание инструмента это промпт*: пишите как для коллеги"
      - "*Вывод обрезаем*: каждый символ оплачивается во всех следующих запросах"
      - "*У команд есть таймаут*: dev-сервер никогда не завершится"

  - type: list
    label: Разбор
    heading: Правила цикла
    numbered: true
    items:
      - Ответ модели кладём в историю целиком
      - Все результаты отправляем одним сообщением
      - Ошибка это тоже результат, модель попробует иначе
      - Отказ пользователя не останавливает агента
      - Лимит шагов защищает кошелёк

  - type: statement
    label: Вывод
    text: Агент это не магия внутри модели, а *несколько десятков строк* вашего кода.
    say: Claude Code и Cursor устроены так же, разница в деталях, которые копятся годами. Значит, поведение агента можно понять, отладить и изменить.

  - type: end
    text: Дальше выносим инструменты *в MCP-серверы*.
    url: balkhaev.com/blog/ru/agent-loop
