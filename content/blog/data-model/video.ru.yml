context: Данные компании · 4/7
scenes:
  - type: title
    kicker: Укрощение данных · часть 4
    title: "Одна история: *клиенты, заказы, деньги*"
    subtitle: Самый трудный и самый ценный слой.

  - type: list
    label: Слои dbt
    heading: Два шага
    numbered: true
    items:
      - "*staging*: понятные имена, типы, фильтры"
      - "*core*: общие таблицы клиентов и заказов"

  - type: list
    label: Сводим клиентов
    heading: По ключам
    items:
      - "*ИНН*: только цифры"
      - "*Почта*: нижний регистр"
      - "*Телефон*: формат E.164"
    say: Общий телефон офиса и почта менеджера только кажутся уникальными. Такие ключи исключаем.

  - type: compare
    label: Спорные пары
    heading: Кто решает
    columns:
      - title: Claude
        points:
          - собирает доводы
          - отвечает по схеме
          - экономит время
      - title: Человек
        pick: true
        points:
          - подтверждает одним нажатием
          - решение хранится в таблице
          - пересборка даёт тот же итог

  - type: statement
    label: Заказы
    text: Заказ с сайта лежит и в базе сайта, и *в 1С*.
    say: Сложили и получили розницу дважды. Склеиваем по номеру заказа сайта в документе 1С.

  - type: end
    text: Дальше *договариваемся о цифрах*.
    url: balkhaev.com/blog/ru/data-model
