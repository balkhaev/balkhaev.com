context: Дообучение · 5/7
scenes:
  - type: title
    kicker: Дообучение · часть 5
    title: "Предпочтения: *DPO и GRPO*"
    subtitle: Учим модель не только правильным ответам, но и тому, что хуже.

  - type: statement
    label: Чего не хватает SFT
    text: SFT показывает правильный ответ, но *не говорит, какая ошибка дороже*.

  - type: compare
    label: Два метода
    heading: Пары или награда
    columns:
      - title: DPO
        points:
          - хороший и плохой ответ
          - пары из правок сотрудников
          - минуты обучения
      - title: GRPO
        pick: true
        points:
          - модель пишет 8 ответов
          - код ставит каждому оценку
          - часы обучения

  - type: list
    label: Награда
    heading: Как оцениваем ответ
    items:
      - "Невалидный JSON: *штраф*"
      - "Верная категория: *плюс*"
      - "Нашли жалобу для человека: *вдвое больше*"
    say: В награде прямо записано, что пропустить жалобу хуже, чем лишний раз позвать человека.

  - type: statement
    label: Опасность
    text: Модель *обманет награду*, если сможет.
    say: Если давать очки только за найденные жалобы, она начнёт звать человека везде. Наказывайте обе ошибки и следите за распределением ответов.

  - type: list
    label: Порядок
    heading: Как применять
    numbered: true
    items:
      - "Сначала *SFT*"
      - "Поверх него *GRPO* или *DPO*"
      - "Проверка *тем же скриптом* оценки"

  - type: end
    text: Дальше *дистилляция*.
    url: balkhaev.com/blog/ru/finetune-preference
