context: Коммерческие автоматизации · 7/8
scenes:
  - type: title
    kicker: Коммерческие автоматизации · часть 7
    title: "Заменяем аналитика: *сводка и тревоги*"
    subtitle: Каждое утро цифры за вчера, а тихие поломки видны за часы, а не за неделю.

  - type: list
    label: Что заменяем
    heading: Утро владельца
    items:
      - "Собрать цифры из трёх мест: *сводка в 9:00*"
      - "Сравнить с обычной неделей: *среднее и стрелки*"
      - "Понять, о чём пишут: *до трёх наблюдений от модели*"
      - "Заметить сломанную форму: *тревога о тишине*"
      - "Заметить, что поддержка не успевает: *тревога об очереди*"

  - type: statement
    label: Главное правило
    text: Все цифры *считает SQL*. Модель получает готовые числа и только подсказывает, куда смотреть.
    say: Языковая модель хорошо замечает закономерности и плохо считает. Если модель недоступна, сводка всё равно уходит.

  - type: diagram
    label: Как устроено
    heading: Сводка и тревоги из одной базы
    nodes:
      - { id: db, label: База, sub: "заявки, заказы, обращения", col: 0, row: 1, w: 3, step: 0 }
      - { id: metrics, label: Метрики, sub: вчера и неделя, col: 4, row: 0, w: 3, step: 1 }
      - { id: claude, label: Claude, sub: наблюдения, col: 8, row: 0, w: 4, step: 2 }
      - { id: digest, label: Сводка, sub: в 9:00, col: 8, row: 2, w: 4, step: 2, accent: true }
      - { id: checks, label: Проверки, sub: раз в 15 минут, col: 4, row: 4, w: 3, step: 3 }
      - { id: alert, label: Чат тревог, sub: началось и закончилось, col: 8, row: 4, w: 4, step: 4 }
    edges:
      - { from: db, to: metrics }
      - { from: metrics, to: claude, label: числа }
      - { from: metrics, to: digest }
      - { from: db, to: checks }
      - { from: checks, to: alert }

  - type: list
    label: Метрики
    heading: Решения в цифрах
    items:
      - "*Медиана, а не среднее*: одна забытая заявка не искажает картину"
      - "*Границы дня* в часовом поясе бизнеса"
      - "*Сравнение со средним за 7 дней*, а не с позавчера"
      - "*Стрелка* только при отличии больше 30%"
      - "*Модели только агрегаты*, без имён и контактов"

  - type: list
    label: Тревоги
    heading: Что ловим
    items:
      - "*Тишина* по заявкам и оплатам дольше обычного"
      - "*Поддержка не успевает*: пять обращений ждут больше 4 часов"
      - "*Воркер отстаёт*: задачи просрочены"
    say: Тревога это состояние, а не сообщение. Одно сообщение в начале проблемы и одно в конце, без спама каждые 15 минут.

  - type: end
    text: Продажи, оплаты, поддержка и аналитика *работают сами*.
    url: balkhaev.com/blog/ru/automations-analytics
