context: Voice agent · 2/7
scenes:
  - type: title
    kicker: Voice agent · part 2
    title: "The cascade: *hear, think, speak*"
    subtitle: Recognition, model and synthesis in one stream.

  - type: diagram
    label: Pipeline
    heading: Nobody waits for anybody
    nodes:
      - { id: mic, label: Caller audio, col: 0, row: 0, w: 3, step: 0 }
      - { id: stt, label: Recognition, sub: interim text, col: 4, row: 0, w: 4, step: 1 }
      - { id: llm, label: Model, sub: token stream, col: 9, row: 0, w: 3, step: 2, accent: true }
      - { id: tts, label: Synthesis, sub: by sentence, col: 8, row: 3, w: 4, step: 3 }
      - { id: out, label: Agent audio, col: 3, row: 3, w: 4, step: 4 }
    edges:
      - { from: mic, to: stt }
      - { from: stt, to: llm }
      - { from: llm, to: tts }
      - { from: tts, to: out }

  - type: list
    label: Recognition
    heading: Measure on your own calls
    items:
      - "A hundred *phone* calls by hand"
      - "Errors in *names, makes, numbers*"
      - "Latency of *the final text*"
      - "A dictionary of *hints*"
    say: Someone else's leaderboard winner can lose on your audio with workshop noise.

  - type: list
    label: Model
    heading: Fast first tokens
    items:
      - "*Claude Haiku 5.5*"
      - "A short prompt *with caching*"
      - "No thinking *out loud*"
      - "One or two *short sentences*"

  - type: statement
    label: Synthesis
    text: The most common mistake is not the voice but *reading numbers*.
    say: A layer between the model and synthesis turns times, dates and plates into words.

  - type: statement
    label: Glue
    text: LiveKit Agents glues it, *we measure* every link.

  - type: end
    text: Next we teach the agent *live dialogue*.
    url: balkhaev.com/blog/voice-pipeline
