context: Корпоративный AI-агент · 7/9
scenes:
  - type: title
    kicker: Корпоративный AI-агент · часть 7
    title: "Контекст и деньги: *кэш, сжатие, лимиты*"
    subtitle: Считаем цену каждого вопроса и делаем её втрое ниже.

  - type: statement
    label: Куда уходят деньги
    text: Каждый шаг цикла заново отправляет *промпт, инструменты и всю историю*.
    say: Результат первого вызова оплачивается на втором шаге, на третьем и дальше, на каждом шаге каждого следующего вопроса.

  - type: compare
    label: Цена разговора
    heading: Десять вопросов подряд
    columns:
      - title: Без кэша
        points:
          - Около 6,8 доллара
          - К десятому вопросу 80 тысяч токенов на шаг
          - Платим в основном за вход
      - title: С кэшем
        pick: true
        points:
          - Около 1,1 доллара
          - Чтение из кэша в 20 раз дешевле входа
          - Тот же ответ

  - type: list
    label: Сначала измерить
    heading: Журнал расходов
    items:
      - "Каждый ответ API содержит *usage*: вход, выход, запись и чтение кэша"
      - Пишем в таблицу время, логин, четыре числа и сумму
      - Одним запросом видно, сколько сотрудник потратил сегодня
      - Раз в месяц сверяем с консолью провайдера

  - type: list
    label: Кэш промптов
    heading: Что незаметно ломает кэш
    items:
      - "*Дата и время в промпте*: префикс меняется каждую минуту"
      - "*Порядок инструментов*: сортируем по имени"
      - "*Правка истории задним числом*: всё после правки не совпадает"
    say: Кэш работает по префиксу и живёт пять минут. Агенту он подходит идеально, история растёт только в конец.

  - type: list
    label: Контекст
    heading: Не пускать лишнее, а длинное сжимать
    items:
      - "*Лимит на результат* любого инструмента с подсказкой «данных больше»"
      - "*Агрегаты вместо строк*: одна строка в промпте"
      - "*Очистка старых результатов* силами API после 60 тысяч токенов"
      - "*Сжатие истории* в краткое изложение после 150 тысяч"

  - type: list
    label: Лимиты
    heading: Предохранители
    numbered: true
    items:
      - Шагов на вопрос
      - Длина одного ответа
      - Глубина размышлений
      - "*Деньги на сотрудника в день*, проверка перед каждым шагом"

  - type: statement
    label: Итог
    text: Второй вопрос в разговоре *втрое дешевле первого*. Сто человек обходятся примерно в две тысячи долларов в месяц.
    say: "Ещё дешевле: пакетная обработка для фоновых задач и модель поменьше для служебных."

  - type: end
    text: Агент считает деньги. Дальше даём ему *интерфейс*.
    url: balkhaev.com/blog/ru/agent-cost
