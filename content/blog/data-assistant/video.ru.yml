context: Данные компании · 6/7
scenes:
  - type: title
    kicker: Укрощение данных · часть 6
    title: "ИИ-помощник: *вопросы обычным языком*"
    subtitle: Claude Opus 5.5 и MCP-сервер поверх метрик.

  - type: list
    label: Инструменты
    heading: Три штуки
    numbered: true
    items:
      - "*list_metrics*: прочитать словарь"
      - "*query_metric*: посчитать метрику"
      - "*sql*: запасной выход"
    say: Модель не пишет запрос для выручки. Она просит выручку, а SQL строит сервер по словарю.

  - type: list
    label: Защита
    heading: Роль только на чтение
    items:
      - "Видит *только витрины*"
      - "Транзакции *только на чтение*"
      - "Запрос *не дольше 10 секунд*"

  - type: list
    label: Правила ответа
    heading: Каждый ответ с источником
    items:
      - "Метрика, период, фильтры"
      - "*Свежесть* данных"
      - "Спорный вопрос: *уточнить*"
      - "Нет данных: *так и сказать*"

  - type: statement
    label: Проверка
    text: Тридцать *настоящих вопросов* с известными ответами.
    say: Прогоняем после каждого изменения словаря или промпта.

  - type: end
    text: Дальше данные *сами приходят к людям*.
    url: balkhaev.com/blog/ru/data-assistant
