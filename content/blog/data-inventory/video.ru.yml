context: Данные компании · 2/7
scenes:
  - type: title
    kicker: Укрощение данных · часть 2
    title: "Карта *источников и вопросов*"
    subtitle: Неделя инвентаризации экономит месяцы.

  - type: list
    label: Как искать
    heading: Через людей, а не через ИТ
    numbered: true
    items:
      - "Где вы *ведёте работу*?"
      - "Какие *отчёты* делаете и откуда цифры?"
      - "Каких цифр вам *не хватает*?"
    say: Третий вопрос самый важный. Из ответов на него собирается список вопросов бизнеса.

  - type: list
    label: Карта
    heading: Для каждого источника
    items:
      - "*Владелец*: кто знает смысл полей"
      - "*Доступ*: API, OData, реплика"
      - "*Объём и частота* изменений"

  - type: diagram
    label: Сущности
    heading: О чём говорят источники
    nodes:
      - { id: cust, label: Клиент, sub: "1С, CRM, сайт", col: 0, row: 0, w: 4, step: 0, accent: true }
      - { id: ord, label: Заказ, sub: 1С и сайт, col: 5, row: 0, w: 3, step: 1 }
      - { id: pay, label: Оплата, sub: 1С, col: 9, row: 0, w: 3, step: 2 }
      - { id: tick, label: Обращение, sub: поддержка, col: 0, row: 3, w: 4, step: 3 }
    edges:
      - { from: cust, to: ord }
      - { from: ord, to: pay }
      - { from: cust, to: tick }

  - type: statement
    label: Доступы
    text: Для каждого источника *своя учётка только на чтение*.
    say: Не пароль бухгалтера и не токен администратора. И реплика вместо основной базы сайта.

  - type: list
    label: Персональные данные
    heading: Копируем только нужное
    items:
      - "Телефон и почта *как хэш*"
      - "Адреса и имена *не нужны*"
      - "Паспорта и карты *никогда*"

  - type: end
    text: Дальше *копируем данные* в хранилище.
    url: balkhaev.com/blog/ru/data-inventory
