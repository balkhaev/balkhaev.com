context: Коммерческие автоматизации · 5/8
scenes:
  - type: title
    kicker: Коммерческие автоматизации · часть 5
    title: "Заменяем бухгалтера: *оплаты, доступы, долги*"
    subtitle: Счёт одной командой, оплата, доступ ровно один раз и напоминания должникам.

  - type: list
    label: Что заменяем
    heading: Рутина вокруг оплат
    items:
      - "Выставить счёт: *одна команда в чате*"
      - "Проверить, пришли ли деньги: *уведомление и сверка раз в час*"
      - "Выдать доступ: *сразу, ночью и в выходные тоже*"
      - "Сообщить команде: *«Оплачено» в чате*"
      - "Напомнить должнику: *на 3, 7 и 14 день*"
    say: Возвраты, споры и всё, где нужно решение, остаются человеку. Система о них только сообщает.

  - type: list
    label: С деньгами иначе
    heading: Три правила
    numbered: true
    items:
      - "Источник правды это *платёжная система*, уведомление только повод спросить"
      - "Заказ становится оплаченным *в одном месте одним условным SQL*"
      - "Каждое внешнее действие это *отдельная задача с ключом*"

  - type: diagram
    label: Как устроено
    heading: Три пути к одной проверке
    nodes:
      - { id: notify, label: Уведомление, sub: от платёжки, col: 0, row: 0, w: 3, step: 0 }
      - { id: hourly, label: Сверка, sub: раз в час, col: 0, row: 2, w: 3, step: 0 }
      - { id: back, label: Возврат клиента, sub: на /pay, col: 0, row: 4, w: 3, step: 0 }
      - { id: check, label: payment.check, sub: спросить платёжку, col: 4, row: 2, w: 3, step: 1 }
      - { id: mark, label: markPaid, sub: только первый раз, col: 8, row: 2, w: 4, step: 2, accent: true }
      - { id: fulfill, label: Доступ, sub: "письмо и сообщение в чат", col: 8, row: 4, w: 4, step: 3 }
    edges:
      - { from: notify, to: check }
      - { from: hourly, to: check }
      - { from: back, to: check }
      - { from: check, to: mark }
      - { from: mark, to: fulfill }
    say: Сколько бы раз и откуда ни пришло подтверждение, доступ выдаётся один раз и только при правильной сумме.

  - type: list
    label: Детали
    heading: Что делает оплату надёжной
    items:
      - "*Деньги в копейках* целым числом, никогда во float"
      - "*Ссылка ведёт к нам*, а не в платёжку, и никогда не протухает"
      - "*Idempotence-Key*: повтор запроса не создаст второй платёж"
      - "*Поддельное уведомление* упрётся в проверку у платёжки"
      - "*Доступ отдельной таблицей*: второй на заказ база не даст"

  - type: statement
    label: Напоминания
    text: Напоминания *не нужно отменять*. Каждое проверяет статус заказа в момент отправки.
    say: После последнего напоминания в чат приходит сообщение, что клиенту пора позвонить.

  - type: list
    label: Проверено
    heading: Что получилось
    items:
      - Счёт одной командой, письмо клиенту за секунды
      - Три подтверждения одного платежа, одна выдача доступа
      - Подделка отклонена, заказ не тронут
      - Потерянное уведомление подхватит сверка

  - type: end
    text: Деньги под контролем. Дальше *заменяем поддержку*.
    url: balkhaev.com/blog/ru/automations-billing
