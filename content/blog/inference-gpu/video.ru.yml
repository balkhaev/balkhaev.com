context: Свой инференс · 2/7
scenes:
  - type: title
    kicker: Свой инференс · часть 2
    title: "Как выбрать видеокарту: *память и скорость*"
    subtitle: Почему важны объём и скорость памяти, а не терафлопсы.

  - type: compare
    label: Два этапа
    heading: Как модель генерирует ответ
    columns:
      - title: Префилл
        points:
          - Читает весь запрос сразу
          - Упирается в вычисления
          - Быстро даже на длинном входе
      - title: Декод
        pick: true
        points:
          - Один токен за раз
          - Каждый раз читает все веса
          - Упирается в скорость памяти

  - type: list
    label: Память
    heading: Что должно поместиться
    items:
      - "*Веса*: параметры × байт на параметр"
      - "*Кэш контекста*: растёт с длиной и числом запросов"
      - "*Служебное*: активации, CUDA, движок"
    say: Для MoE-моделей считается общее число параметров, а не активное. Все эксперты лежат в памяти.

  - type: list
    label: Форматы
    heading: Модель на 27 миллиардов параметров
    items:
      - "*BF16*, 2 байта: 54 ГБ"
      - "*FP8*, 1 байт: 27 ГБ"
      - "*FP4 или INT4*, полбайта: около 15 ГБ"
    say: Правило на глаз, вес в выбранном формате плюс 20–50 процентов на кэш и служебное.

  - type: statement
    label: Скорость
    text: Потолок скорости ≈ *скорость памяти / размер активных весов*.
    say: Плотная 27B в FP8 на H100 даёт потолок около ста токенов в секунду. MoE с тремя миллиардами активных в разы быстрее.

  - type: list
    label: Что сдают в аренду
    heading: Видеокарты и цены за час
    items:
      - "*RTX 4090*, 24 ГБ: около 0,9 доллара"
      - "*RTX 5090*, 32 ГБ: около 1,2 доллара"
      - "*RTX PRO 6000*, 96 ГБ: около 2,5, лучшая цена за гигабайт"
      - "*H100*, 80 ГБ: 3–4 доллара, стандарт инференса"
      - "*H200*, 141 ГБ: около 5,3 доллара"

  - type: statement
    label: Несколько карт
    text: Одна большая видеокарта *лучше двух маленьких*.
    say: Серверные карты связаны NVLink и работают почти как одна. Потребительские через PCIe теряют на обмене.

  - type: list
    label: За пять минут
    heading: Выбор по весу в FP8 плюс 30%
    items:
      - "До 24 ГБ: *RTX 4090*"
      - "До 32 ГБ: *RTX 5090*"
      - "До 96 ГБ: *RTX PRO 6000*, или H100 ради скорости"
      - "До 141 ГБ: *H200*"
      - "Больше: *несколько карт, FP4 или провайдер*"

  - type: end
    text: Видеокарту прикинули. Дальше выбираем *модель и движок*.
    url: balkhaev.com/blog/ru/inference-gpu
