context: Дообучение · 7/7
scenes:
  - type: title
    kicker: Дообучение · часть 7
    title: "В прод: *адаптер в vLLM*"
    subtitle: Теневой режим, переключение и переобучение.

  - type: compare
    label: Как держать
    heading: Адаптер или слитая модель
    columns:
      - title: Адаптер поверх базы
        pick: true
        points:
          - много задач на одной GPU
          - версия это файл на десятки МБ
          - откат сменой имени
      - title: Слитая модель
        points:
          - чуть быстрее
          - можно сжать в FP8
          - своя копия на задачу

  - type: list
    label: Выпуск
    heading: Три шага
    numbered: true
    items:
      - "*Тень*: отвечает Claude, адаптер пишет в лог"
      - "*Часть трафика*: 10% с откатом на Claude"
      - "*Весь трафик*: Claude только откат"
    say: Тест это прошлое. Поток в проде всегда немного другой, поэтому трафик переводим постепенно.

  - type: statement
    label: Главная метрика
    text: Доля карточек, которые *поправил человек*.
    say: Каждая правка одновременно сигнал о качестве и новый обучающий пример.

  - type: list
    label: Цикл
    heading: Раз в месяц
    items:
      - "Свежие правки в *новую версию датасета*"
      - "Новый адаптер *теми же скриптами*"
      - "Сравнение с текущим *на тесте*"
      - "Тень и *переключение по имени*"

  - type: list
    label: Итог
    heading: Весь цикл в семи шагах
    numbered: true
    items:
      - Нужно ли дообучение
      - Данные из логов и правок
      - Тест отложен первым
      - LoRA на арендованной GPU
      - Оценка против базы и Claude
      - Доводка GRPO или DPO
      - Тень, переключение, переобучение

  - type: end
    text: Цикл закончен. Модель *учится на каждой правке*.
    url: balkhaev.com/blog/ru/finetune-serve
