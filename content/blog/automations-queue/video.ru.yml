context: Коммерческие автоматизации · 3/8
scenes:
  - type: title
    kicker: Коммерческие автоматизации · часть 3
    title: "Сердце системы: *события, очередь и повторы*"
    subtitle: Ядро, на котором будут работать все автоматизации.

  - type: list
    label: Что может пойти не так
    heading: Это случится в первый же месяц
    items:
      - "*Чужие запросы*: поддельная «оплата» на адрес вебхука"
      - "*Повторная доставка* одного события"
      - "*Внешний сервис лежит*, через минуту работает"
      - "*Воркер упал* посреди задачи"
      - "*Ошибка в коде*: задача падает при каждой попытке"
      - "*Никто не заметил*, и автоматизация молчит неделю"

  - type: diagram
    label: Как устроено
    heading: Приёмник только записывает
    nodes:
      - { id: hook, label: Вебхук, sub: POST /hooks/:source, col: 0, row: 0, w: 3, step: 0 }
      - { id: tx, label: Одна транзакция, sub: событие + задачи, col: 4, row: 0, w: 4, step: 1, accent: true }
      - { id: worker, label: Воркер, sub: берёт задачу, col: 4, row: 3, w: 4, step: 2 }
      - { id: done, label: done, col: 9, row: 2, w: 3, step: 3 }
      - { id: failed, label: failed + тревога, col: 9, row: 4, w: 3, step: 3 }
    edges:
      - { from: hook, to: tx, label: подпись ок }
      - { from: tx, to: worker }
      - { from: worker, to: done }
      - { from: worker, to: failed, label: попытки кончились }
    say: HTTP-обработчик быстрый и почти не падает. Вся внешняя работа в воркере, а при сбое задача ждёт и пробует снова.

  - type: list
    label: Таблица задач
    heading: Поля, на которых держится надёжность
    items:
      - "*status*: pending, running, done, failed"
      - "*run_at*: не раньше какого момента выполнять"
      - "*locked_until*: умерший воркер отпускает задачу"
      - "*key*: ключ идемпотентности, дубль не создастся"
      - "*event_id*: почему это произошло"

  - type: statement
    label: Очередь на Postgres
    text: "*FOR UPDATE SKIP LOCKED*: каждый воркер берёт свою задачу, без брокера сообщений."
    say: Паузы между попытками растут вдвое, от десяти секунд до часа, со случайным разбросом. Постоянные ошибки не повторяем зря.

  - type: list
    label: Подписи
    heading: Как убедиться, что запрос настоящий
    items:
      - "*HMAC*: подпись тела общим секретом"
      - "*Секрет в заголовке*: проще, так работает Telegram"
      - "Сравнение через *timingSafeEqual*, а не через ==="

  - type: statement
    label: Расписание
    text: "Расписание через ту же очередь: ключ задачи это *слот времени*."
    say: Сколько бы воркеров ни работало, задача на слот одна. Если воркер лежал в девять и поднялся в девять сорок, задача всё равно выполнится.

  - type: list
    label: Проверка
    heading: Система переживает сбои
    items:
      - "Событие дважды: *задача одна*"
      - "Неверный секрет: *401*, в базе ничего"
      - "Telegram ответил 502: *вторая попытка прошла*"
      - "Неизвестный тип: *тревога в чат*"
      - "Остановка при деплое: *доделал текущую задачу*"

  - type: end
    text: Ядро готово. Дальше первая автоматизация, *заменяем продажника*.
    url: balkhaev.com/blog/ru/automations-queue
