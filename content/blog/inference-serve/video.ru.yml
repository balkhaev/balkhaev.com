context: Свой инференс · 5/7
scenes:
  - type: title
    kicker: Свой инференс · часть 5
    title: "Свой эндпоинт: *vLLM*"
    subtitle: Запуск, замер скорости и доступ по ключу.

  - type: diagram
    label: Схема
    heading: Что запускаем
    nodes:
      - { id: app, label: Продукт, sub: OpenAI-клиент, col: 0, row: 1, w: 3, step: 0 }
      - { id: key, label: Ключ и HTTPS, col: 4, row: 1, w: 3, step: 1 }
      - { id: vllm, label: vLLM, sub: модель в FP8, col: 8, row: 1, w: 4, step: 2, accent: true }
      - { id: vol, label: Постоянный диск, sub: веса модели, col: 8, row: 4, w: 4, step: 3 }
    edges:
      - { from: app, to: key }
      - { from: key, to: vllm }
      - { from: vol, to: vllm }

  - type: list
    label: Запуск
    heading: Одна команда
    numbered: true
    items:
      - "*Официальный образ* vLLM с фиксированной версией"
      - "*Том* с весами, чтобы не качать их заново"
      - "*Ограничение контекста* под вашу задачу"
      - "*Кэш в FP8*: вдвое больше токенов в памяти"

  - type: statement
    label: Главное
    text: Запустить просто. Важнее *замерить скорость* под нагрузкой.
    say: Прогоните тест с одним, четырьмя, шестнадцатью и шестьюдесятью четырьмя параллельными запросами.

  - type: list
    label: Замер
    heading: Три числа
    items:
      - "*Время до первого токена* растёт с очередью"
      - "*Скорость одного запроса* падает, но медленно"
      - "*Суммарная скорость* растёт, пока карта не насытится"
    say: Найдите точку, где задержка ещё приемлема, и по ней считайте цену миллиона токенов.

  - type: list
    label: Доступ
    heading: Не оставляйте эндпоинт открытым
    items:
      - "*Длинный случайный ключ* в секретах"
      - "*Только HTTPS*"
      - "*Прокси с лимитами*, если клиентов несколько"
      - "*Метрики*: очередь, кэш, токены"

  - type: statement
    label: Подключение
    text: Для продукта это обычный OpenAI API. Меняются только *адрес и ключ*.

  - type: end
    text: Текст работает. Дальше *изображения и видео*.
    url: balkhaev.com/blog/ru/inference-serve
