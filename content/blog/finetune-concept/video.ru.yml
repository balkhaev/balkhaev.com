context: Дообучение · 1/7
scenes:
  - type: title
    kicker: Дообучение · часть 1
    title: "Когда дообучать, а когда *хватит промпта*"
    subtitle: Своя модель под свою задачу. Начинаем с вопроса, нужно ли это вообще.

  - type: compare
    label: Что меняет дообучение
    heading: Поведение, а не знания
    columns:
      - title: Хорошо даёт
        pick: true
        points:
          - Строгий формат ответа
          - Ваш тон и стиль
          - Узкий навык без длинного промпта
          - Маленькую модель вместо большой
      - title: Плохо даёт
        points:
          - Новые факты и цены
          - Ссылки на источник
          - Ум сильнее исходной модели

  - type: list
    label: Лестница решений
    heading: Сначала дешёвые ступени
    numbered: true
    items:
      - "*Промпт*: инструкция и JSON-схема"
      - "*Примеры в промпте*: 5–20 разобранных случаев"
      - "*Поиск и RAG*: нужные документы в запросе"
      - "*Дообучение*: когда всё ещё плохо или дорого"
    say: Факты кладут в поиск, а не в веса. Факты меняются, а переучивать модель после каждого прайса никто не будет.

  - type: list
    label: Когда оправдано
    heading: Три условия
    items:
      - "Задача *узкая и массовая*"
      - "Результат *можно проверить*"
      - "Есть *сотни и тысячи примеров*"

  - type: statement
    label: Деньги
    text: Запуск LoRA стоит *несколько долларов*. Дорого обходятся данные и оценка.
    say: Главная выгода обычно не в качестве, а в цене. Маленькая дообученная модель делает одну работу в десятки раз дешевле.

  - type: diagram
    label: Что построим
    heading: Разбор обращений на своей модели
    nodes:
      - { id: logs, label: Логи и правки, col: 0, row: 0, w: 3, step: 0 }
      - { id: data, label: Датасет, sub: train и тест, col: 4, row: 0, w: 3, step: 1 }
      - { id: sft, label: LoRA, sub: арендованная GPU, col: 8, row: 0, w: 4, step: 2 }
      - { id: eval, label: Оценка, sub: против Claude, col: 8, row: 3, w: 4, step: 3, accent: true }
      - { id: serve, label: vLLM в проде, col: 3, row: 3, w: 4, step: 4 }
    edges:
      - { from: logs, to: data }
      - { from: data, to: sft }
      - { from: sft, to: eval }
      - { from: eval, to: serve }
      - { from: serve, to: logs, label: новые правки }

  - type: end
    text: Дальше собираем *данные*.
    url: balkhaev.com/blog/ru/finetune-concept
