context: Свой инференс · 1/7
scenes:
  - type: title
    kicker: Свой инференс · часть 1
    title: "Когда своя модель *выгоднее API*"
    subtitle: Открытые модели на арендованных видеокартах. Считаем, когда это окупается.

  - type: compare
    label: Две модели оплаты
    heading: Платить за токены или за время
    columns:
      - title: API
        points:
          - Платите за каждый токен
          - Нет запросов, нет счёта
          - Провайдер собирает нагрузку тысяч клиентов
      - title: Своя видеокарта
        pick: true
        points:
          - Платите за каждый час
          - Простой стоит столько же
          - Выгодна ровно настолько, насколько загружена

  - type: list
    label: Окупаемость
    heading: Видеокарта за 3 доллара в час
    items:
      - "Один пользователь, 50 токенов в секунду: *около 17 долларов* за миллион"
      - "Несколько запросов, 300 в секунду: *около 2,8 доллара*"
      - "Забита батчами, 1500 в секунду: *около 0,55 доллара*"
      - "Ночь и выходные, 0 в секунду: *бесконечность*"
    say: Цена миллиона токенов это цена часа, делённая на число токенов за час. Всё решает загрузка.

  - type: list
    label: Когда стоит
    heading: Своя модель имеет смысл
    items:
      - "*Большие объёмы потоком*: разметка миллиона обращений"
      - "*Постоянная нагрузка* круглые сутки"
      - "*Своя дообученная модель* или LoRA"
      - "*Контроль над версией*, никто её не снимет"
      - "*Картинки, видео и 3D* со своими пайплайнами"

  - type: list
    label: Когда не стоит
    heading: Лучше остаться на API
    items:
      - "*Мало запросов*, и они неравномерны"
      - "*Нужно лучшее качество*: топовые открытые модели требуют сервер из восьми карт"
      - "*Нет времени на эксплуатацию*: своя модель это сервер"
    say: Есть середина, о которой забывают. Та же открытая модель у провайдера с оплатой за токены.

  - type: diagram
    label: Решение
    heading: Три вопроса до аренды
    nodes:
      - { id: q1, label: "Нужно лучшее качество?", col: 0, row: 0, w: 4, step: 0 }
      - { id: api, label: Коммерческий API, col: 0, row: 3, w: 4, step: 1 }
      - { id: q2, label: "Картинки, видео?", col: 5, row: 0, w: 3, step: 1 }
      - { id: q3, label: "GPU загружена?", col: 5, row: 3, w: 3, step: 2 }
      - { id: own, label: Своя модель, sub: на арендованной GPU, col: 9, row: 0, w: 3, step: 3, accent: true }
      - { id: hosted, label: Открытая модель, sub: у провайдера, col: 9, row: 4, w: 3, step: 3 }
    edges:
      - { from: q1, to: api, label: да }
      - { from: q1, to: q2, label: нет }
      - { from: q2, to: own, label: да }
      - { from: q2, to: q3, label: нет }
      - { from: q3, to: own, label: да }
      - { from: q3, to: hosted, label: нет }

  - type: list
    label: Что построим
    heading: К концу цикла
    items:
      - Расчёт памяти и выбор видеокарты
      - Модель и движок под задачу
      - Аренда на RunPod или Vast.ai с весами на постоянном диске
      - vLLM с OpenAI-совместимым API, ключом и замером скорости
      - ComfyUI для картинок и видео
      - Таблица реальной стоимости при вашей нагрузке

  - type: end
    text: Дальше выбираем *видеокарту*.
    url: balkhaev.com/blog/ru/inference-concept
