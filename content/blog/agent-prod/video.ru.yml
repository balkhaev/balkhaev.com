context: Корпоративный AI-агент · 9/9
scenes:
  - type: title
    kicker: Корпоративный AI-агент · часть 9
    title: "В прод: *периметр, аудит и проверки*"
    subtitle: Последняя часть серии. Агент внутри периметра компании.

  - type: list
    label: Вопросы безопасности
    heading: На что надо ответить до запуска
    items:
      - "*Куда уходят данные?*"
      - "*Что произошло?* Найти разговор и понять, откуда цифра"
      - "*Кто командует агентом?* Документ не должен"
      - "*Не стало ли хуже* после смены промпта или модели?"
      - "*Не сломались ли права* после правки миграции?"

  - type: diagram
    label: Периметр
    heading: Сеть без выхода наружу и три двери
    nodes:
      - { id: users, label: Сотрудники и Slack, col: 0, row: 0, w: 3, step: 0 }
      - { id: ingress, label: ingress, sub: nginx, col: 0, row: 3, w: 3, step: 1 }
      - { id: agent, label: Агент, sub: "веб-чат, бот, цикл", col: 4, row: 3, w: 4, step: 2, accent: true }
      - { id: egress, label: egress, sub: "squid, список доменов", col: 9, row: 1, w: 3, step: 3 }
      - { id: pg, label: pg-gateway, sub: одна реплика базы, col: 9, row: 4, w: 3, step: 3 }
    edges:
      - { from: users, to: ingress }
      - { from: ingress, to: agent }
      - { from: agent, to: egress, label: "API модели, SSO" }
      - { from: agent, to: pg }
    say: Даже если в коде или модели что-то пойдёт не так, данные смогут уйти только на заранее известные адреса.

  - type: statement
    label: Журнал аудита
    text: Каждый вопрос получает свой *turn*, и по нему достаётся вся цепочка вызовов.
    say: Журнал содержит те же данные, что видел сотрудник, поэтому читать его может только служба безопасности.

  - type: list
    label: Промпт-инъекции
    heading: Защита слоями
    numbered: true
    items:
      - "*Права*: агент видит только то, что спрашивающий, и только читает"
      - "*Рамка и промпт*: документ в теге, данные не команды"
      - "*Данные не уходят через ответ*: вырезаем внешние ссылки и картинки"
      - "*Периметр*: squid не выпустит запрос на чужой домен"
      - "*Заметить*: проверочный вопрос и ежедневный мониторинг"
    say: Надёжного способа заставить модель не слушать прочитанный текст нет. Поэтому главные слои те, что не зависят от модели.

  - type: list
    label: Проверки
    heading: Каждая правка проходит через тесты
    items:
      - "*Проверочные вопросы*: нужные факты есть, запрещённых нет"
      - "*Несколько прогонов*: модель отвечает по-разному"
      - "*Атаки на базу как тесты* в CI на каждый пуш"
      - "*Каждая жалоба* превращается в новый вопрос"

  - type: list
    label: Перед запуском
    heading: Чек-лист
    items:
      - Безопасность и юристы согласовали данные
      - Учебный вход выключен, SSO корпоративный
      - Секреты в хранилище, план ротации
      - Тесты атак зелёные, проверочные вопросы прогнаны
      - Лимиты настроены и есть кнопка выключения

  - type: statement
    label: Итог серии
    text: Модель здесь *самая простая часть*.
    say: Основная работа в том, чтобы агент видел ровно то, что положено человеку, и чтобы любое его действие можно было проверить.

  - type: end
    text: Девять частей, от одного вызова API *до прода*.
    url: balkhaev.com/blog/ru/agent-prod
