context: Свой инференс · 7/7
scenes:
  - type: title
    kicker: Свой инференс · часть 7
    title: "Деньги: *цена миллиона токенов*"
    subtitle: Простой, расписание и serverless.

  - type: statement
    label: Формула
    text: Реальная цена это *счёт за месяц*, делённый на полезные токены за месяц.
    say: А не цена часа, делённая на скорость. Простой съедает экономию быстрее всего.

  - type: list
    label: Счёт
    heading: Из чего он складывается
    items:
      - "*Часы видеокарты*, включая ночи и простой"
      - "*Хранилище*: том с весами и диски остановленных подов"
      - "*Эксперименты*: подняли, попробовали, удалили"
      - "*Ваше время* на обновления и аварии"

  - type: compare
    label: Три режима
    heading: Сколько выходит в месяц
    columns:
      - title: Всегда включена
        points:
          - 730 часов
          - около $2200
          - только при круглосуточной нагрузке
      - title: По расписанию
        pick: true
        points:
          - около 220 часов
          - около $660
          - рабочие часы и пакеты
      - title: Serverless
        points:
          - платим за обработку
          - около $400
          - редкие запросы

  - type: list
    label: Режим 2
    heading: Как гасить видеокарту
    items:
      - "*Расписание*: старт утром, стоп вечером через API"
      - "*Остановка по простою*: полчаса без запросов"
      - "*Пакетная задача* удаляет под в конце"

  - type: list
    label: Режим 3
    heading: Чем платить за serverless
    items:
      - "*Холодный старт*: первый запрос ждёт загрузки весов"
      - "*Секунда дороже*, чем у пода"
      - "*Один активный воркер* убирает холодный старт"

  - type: list
    label: Итог
    heading: Весь цикл в пяти шагах
    numbered: true
    items:
      - Посчитайте загрузку и решите, нужна ли своя модель
      - Выберите модель на своих примерах до аренды
      - Посчитайте память и выберите видеокарту
      - Поднимите vLLM и замерьте скорость
      - Выберите режим и сравните с ценой у провайдера

  - type: end
    text: Цикл закончен. Своя модель выгодна, пока *видеокарта занята*.
    url: balkhaev.com/blog/ru/inference-cost
