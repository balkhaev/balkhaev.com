context: Корпоративный AI-агент · 4/9
scenes:
  - type: title
    kicker: Корпоративный AI-агент · часть 4
    title: "MCP: подключаем *внутренние системы*"
    subtitle: Выносим инструменты в отдельные серверы и пишем свой сервер для базы компании.

  - type: diagram
    label: Что такое MCP
    heading: Открытый протокол между агентом и инструментами
    nodes:
      - { id: agent, label: Агент, sub: MCP-клиент внутри, col: 0, row: 1, w: 3, step: 0, accent: true }
      - { id: db, label: Сервер базы, sub: query, describe_schema, col: 6, row: 0, w: 5, step: 1 }
      - { id: wiki, label: Сервер вики, sub: search, col: 6, row: 2, w: 5, step: 1 }
      - { id: tracker, label: Сервер трекера, sub: issues, col: 6, row: 4, w: 5, step: 1 }
    edges:
      - { from: agent, to: db, both: true }
      - { from: agent, to: wiki, both: true, label: stdio или HTTP }
      - { from: agent, to: tracker, both: true }
    say: Сервер знает одну систему, отдаёт список инструментов и выполняет их. Клиент в агенте собирает инструменты со всех серверов и показывает модели.

  - type: list
    label: Зачем
    heading: Что даёт MCP
    items:
      - "*Разделение*: сервер базы пишет команда, которая знает базу"
      - "*Готовые серверы*: GitHub, Jira, Confluence, Slack, Postgres"
      - "*Переиспользование*: тот же сервер работает в Claude Desktop и Cursor"
      - "*Изоляция*: пароль от базы знает только сервер, не модель"

  - type: list
    label: Сервер базы
    heading: Два инструмента и четыре решения
    items:
      - "*Описание схемы руками*: что значит колонка, в каких единицах суммы"
      - "*Только чтение дважды*: проверка на SELECT и база в режиме readonly"
      - "*Лимит строк*: модели нужны агрегаты, а не сто тысяч строк"
      - "*Ошибки возвращаются*: модель читает ошибку и чинит запрос"

  - type: statement
    label: Агент как клиент
    text: Серверы описаны в *mcp.json*, в том же формате, что у Claude Desktop и Cursor.
    say: Агент подключается к каждому, забирает инструменты и добавляет префикс сервера, чтобы два поиска не перепутались.

  - type: statement
    label: Пробуем
    text: «Выручка за октябрь по регионам?» Модель смотрит схему, пишет *JOIN и GROUP BY*, исправляет ошибки.
    say: А вопрос про зарплату коллеги агент тоже ответит. Таблица доступна целиком, и это проблема, которую решим в части про права.

  - type: compare
    label: Выбор
    heading: Произвольный SQL или узкие функции
    columns:
      - title: Произвольный SQL
        points:
          - Отвечает на непредусмотренное
          - Может написать тяжёлый запрос
          - Нужна реплика и таймауты
      - title: Узкие инструменты
        points:
          - Предсказуемо и быстро
          - Легко проверить
          - Каждый вопрос требует кода
      - title: Смесь
        pick: true
        points:
          - Узкие для важных метрик
          - SQL для всего остального

  - type: end
    text: "Таблицы есть. Дальше *знания в тексте*: вики, регламенты, договоры."
    url: balkhaev.com/blog/ru/agent-mcp
