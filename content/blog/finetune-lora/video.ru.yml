context: Дообучение · 3/7
scenes:
  - type: title
    kicker: Дообучение · часть 3
    title: "Первый запуск: *LoRA* на одной видеокарте"
    subtitle: Unsloth и TRL на арендованной GPU.

  - type: statement
    label: Что такое LoRA
    text: Веса модели заморожены, учатся *маленькие добавочные матрицы*.
    say: На выходе адаптер на десятки мегабайт. Качество почти как у полного дообучения, памяти в разы меньше.

  - type: list
    label: Базовая модель
    heading: Как выбрать
    items:
      - "*Instruct*, а не base"
      - "*Apache 2.0* или MIT"
      - "*Самая маленькая*, которая почти справляется"
      - "Например, *Qwen3.5-9B*"

  - type: compare
    label: Видеокарта
    heading: Сколько памяти для 9B
    columns:
      - title: LoRA в 16 битах
        pick: true
        points:
          - 30–40 ГБ
          - карта на 48–96 ГБ
          - лучше качество
      - title: QLoRA в 4 битах
        points:
          - 12–20 ГБ
          - RTX 4090 или 5090
          - медленнее

  - type: list
    label: Параметры
    heading: Важны единицы
    items:
      - "Ранг *16*, alpha равна рангу"
      - "Скорость обучения *2e-4*"
      - "*Одна-три* эпохи"
      - "Ошибка *только на ответе*"
      - "Тот же *шаблон чата*, что в проде"

  - type: compare
    label: График ошибки
    heading: Как читать
    columns:
      - title: Обе падают
        pick: true
        points:
          - модель учится
      - title: Validation растёт
        points:
          - заучивает примеры
          - берите лучший чекпоинт
      - title: Ошибка скачет
        points:
          - уменьшите скорость вдвое

  - type: statement
    label: Деньги
    text: Две тысячи примеров, *до часа* и пара долларов.

  - type: end
    text: Дальше честная *оценка*.
    url: balkhaev.com/blog/ru/finetune-lora
