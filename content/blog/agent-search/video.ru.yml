context: Корпоративный AI-агент · 5/9
scenes:
  - type: title
    kicker: Корпоративный AI-агент · часть 5
    title: "Знания компании: *поиск по документам*"
    subtitle: Индексируем вики и учим агента искать так, как ищет человек.

  - type: statement
    label: RAG
    text: "RAG значит одно: перед ответом *найти нужные документы* и дать их модели."
    say: Как искать, в определении не сказано. Векторы это лишь один из способов, и не всегда лучший.

  - type: compare
    label: Два подхода
    heading: Классический RAG или поиск как инструмент
    columns:
      - title: Один поиск по векторам
        points:
          - Одна попытка, переспросить нельзя
          - Плохо ищет номера и фамилии
          - Пересчёт эмбеддингов при правках
      - title: Поиск в агентном цикле
        pick: true
        points:
          - Модель сама пишет запрос
          - Ищет другими словами, если пусто
          - Открывает документ целиком
          - BM25 дёшев и прозрачен

  - type: diagram
    label: Как устроено
    heading: От вики до ответа со ссылкой
    nodes:
      - { id: wiki, label: Вики, sub: "markdown, поле access", col: 0, row: 1, w: 3, step: 0 }
      - { id: index, label: Индекс, sub: фрагменты по заголовкам, col: 4, row: 1, w: 4, step: 1 }
      - { id: server, label: MCP-сервер, sub: search и read, col: 4, row: 4, w: 4, step: 2, accent: true }
      - { id: agent, label: Агент, sub: ответ со ссылкой, col: 9, row: 4, w: 3, step: 3 }
    edges:
      - { from: wiki, to: index }
      - { from: index, to: server, label: FTS5 + BM25 }
      - { from: server, to: agent, both: true }
    say: Документы режем по заголовкам и кладём в полнотекстовый индекс. Сервер даёт два инструмента, найти фрагменты и прочитать документ целиком.
  - type: list
    label: Решения
    heading: Что делает поиск хорошим
    items:
      - "*Фрагмент = раздел*: заголовок документа хранится рядом"
      - "*Веса BM25*: совпадение в названии важнее, чем в тексте"
      - "*Морфология*: обрезаем окончания и ищем по префиксу"
      - "*OR вместо AND*: пустая выдача хуже лишних результатов"
      - "*Описание учит искать*: короткие запросы, переформулируй"

  - type: statement
    label: Пробуем
    text: «Условия оплаты у клиента и сколько мы с ним заработали?» Агент берёт *договор из вики и цифры из базы*.
    say: Но документ про оклады он тоже покажет, хотя видеть его могут только HR и руководство. Права пока только хранятся, проверять их будем дальше.

  - type: list
    label: Векторы
    heading: Что попробовать до векторного индекса
    items:
      - Словарь синонимов корпоративных терминов
      - Подсказка искать двумя-тремя формулировками
      - Контекст у каждого фрагмента
      - "Если промахи остаются: векторы *рядом* с полнотекстом, не вместо"
    say: Решайте по измерениям, а не по моде. Записывайте вопросы, где агент не нашёл ответ, хотя документ был.

  - type: end
    text: "Дальше главное: агент, который действует *от имени сотрудника*."
    url: balkhaev.com/blog/ru/agent-search
