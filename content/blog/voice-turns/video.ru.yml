context: Голосовой агент · 3/7
scenes:
  - type: title
    kicker: Голосовой агент · часть 3
    title: "Живой диалог, *а не рация*"
    subtitle: Паузы, конец реплики и перебивания.

  - type: statement
    label: Проблема
    text: "«Запишите меня на…» *ещё не конец фразы*."
    say: Короткий порог тишины перебивает задумавшихся, длинный делает агента тормозом.

  - type: diagram
    label: Два сигнала
    heading: Тишина плюс смысл
    nodes:
      - { id: vad, label: VAD, sub: сколько тишины, col: 0, row: 0, w: 4, step: 0 }
      - { id: eou, label: Модель конца реплики, sub: закончена ли мысль, col: 6, row: 0, w: 6, step: 1, accent: true }
      - { id: dec, label: Ждать коротко или долго, col: 3, row: 3, w: 6, step: 2 }
    edges:
      - { from: vad, to: dec }
      - { from: eou, to: dec }

  - type: list
    label: Перебивание
    heading: Три шага
    numbered: true
    items:
      - "*Замолчать* за пару сотен миллисекунд"
      - "Оставить в истории *только сказанное*"
      - "*Слушать* новую реплику"

  - type: list
    label: Не перебивание
    heading: Что игнорировать
    items:
      - "*Угу*, да-да, так"
      - "Кашель и *короткие звуки*"
      - "*Шум* мастерской"
    say: Если агент замолкает на каждое угу, разговор становится рваным.

  - type: statement
    label: Тишина
    text: Пока ищет данные, говорит *«секунду, смотрю»*.

  - type: end
    text: Дальше подключаем *настоящий телефон*.
    url: balkhaev.com/blog/ru/voice-turns
