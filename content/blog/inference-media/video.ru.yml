context: Свой инференс · 6/7
scenes:
  - type: title
    kicker: Свой инференс · часть 6
    title: "Картинки и видео: *ComfyUI*"
    subtitle: Открытые модели для медиа на арендованной видеокарте.

  - type: statement
    label: Чем отличается
    text: Для картинок своя видеокарта *выгоднее API чаще*, чем для текста.
    say: Пайплайн со своими LoRA и цепочкой моделей у провайдера не повторить.

  - type: list
    label: Картинки
    heading: Модели с коммерческой лицензией
    items:
      - "*Qwen-Image*: Apache 2.0, 16–24 ГБ"
      - "*Z-Image Turbo*: Apache 2.0, быстрая"
      - "*FLUX.2 klein 4B*: Apache 2.0, около 8 ГБ"
      - "*FLUX.2 dev*: сильная, но нужна лицензия BFL"

  - type: list
    label: Видео
    heading: Модели для роликов
    items:
      - "*Wan 2.2 5B*: Apache 2.0, от 8 ГБ, до 720p"
      - "*Wan 2.2 A14B*: полное качество, 40–48 ГБ"
      - "*HunyuanVideo 1.5*: до 100 млн пользователей"
      - "*LTX-2.3*: видео со звуком, лимит по выручке"

  - type: statement
    label: Лицензия
    text: Главное при выборе медиамодели это *лицензия*. У многих сильных она некоммерческая.

  - type: compare
    label: Видеокарта
    heading: Сколько памяти
    columns:
      - title: Картинки
        pick: true
        points:
          - RTX 4090 или 5090
          - 24–32 ГБ
      - title: Видео до 720p
        points:
          - RTX PRO 6000 или L40S
          - 48–96 ГБ
      - title: Длинные ролики
        points:
          - H100, H200

  - type: list
    label: Пайплайн как API
    heading: ComfyUI в продакшене
    items:
      - "*JSON пайплайна в репозитории*: это и есть ваша модель"
      - "*Фиксируйте версии* ComfyUI и узлов"
      - "*Своя очередь задач*, если генераций много"
      - "*Serverless-воркер* для неравномерной нагрузки"

  - type: end
    text: Всё запущено. Осталось посчитать *деньги*.
    url: balkhaev.com/blog/ru/inference-media
