context: Свой инференс · 3/7
scenes:
  - type: title
    kicker: Свой инференс · часть 3
    title: "Что поднимать: *модели и движки*"
    subtitle: Какие открытые модели запускать на арендованной видеокарте и на чём.

  - type: list
    label: Рынок
    heading: Основные семейства открытых моделей
    items:
      - "*Qwen*: самая широкая линейка, почти всё под Apache 2.0"
      - "*DeepSeek*: огромные MoE, сильны в рассуждениях и коде"
      - "*GLM, Kimi*: код, агенты и самые большие модели"
      - "*Gemma*: небольшие и средние, для одной видеокарты"
      - "*gpt-oss*: две MoE, сразу в сжатом формате"

  - type: statement
    label: Сначала лицензия
    text: «Открытая» значит разное. Для продукта проще держаться *Apache 2.0 и MIT*.
    say: У части моделей своя лицензия с ограничениями по размеру компании, а часть моделей для картинок вообще некоммерческие.

  - type: list
    label: Под бюджет
    heading: Что помещается
    items:
      - "*24–32 ГБ*: Qwen3.6-35B-A3B, Gemma 4 26B, gpt-oss-20b"
      - "*80–141 ГБ*: Qwen3.8-27B, Gemma 4 31B, gpt-oss-120b"
      - "*300–600 ГБ*: GLM-5.3-Flash, DeepSeek V4.1 Flash на 4–8 картах"
      - "*От терабайта*: флагманы, это уже кластер"
    say: Главный сегмент, одна серверная карта с моделью на двадцать–тридцать миллиардов. Она закрывает большинство задач.

  - type: list
    label: Под задачу
    heading: Что брать
    items:
      - "*Разметка и извлечение*: быстрая MoE со структурированным выводом"
      - "*Чат и база знаний*: плотная модель с длинным контекстом"
      - "*Агенты*: модель, которая стабильно вызывает инструменты"
      - "*Эмбеддинги и реранкеры*: самый недооценённый сценарий"

  - type: list
    label: До аренды
    heading: Проверьте модель на своих примерах
    numbered: true
    items:
      - Соберите 50–100 реальных примеров с правильными ответами
      - Прогоните кандидатов у провайдера с оплатой за токены
      - Посчитайте долю верных и посмотрите на ошибки
      - Возьмите самую маленькую модель, которая справляется

  - type: compare
    label: Движки
    heading: На чём запускать
    columns:
      - title: vLLM
        pick: true
        points:
          - Выбор по умолчанию
          - Почти все модели и карты
          - OpenAI-совместимый API
      - title: SGLang
        points:
          - Агенты и длинные диалоги
          - Лучше кэш общего начала
      - title: llama.cpp, Ollama
        points:
          - Локально, Mac, CPU
          - Не для серверной нагрузки

  - type: end
    text: Модель и движок выбраны. Дальше идём *за видеокартой*.
    url: balkhaev.com/blog/ru/inference-models
