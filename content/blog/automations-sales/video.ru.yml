context: Коммерческие автоматизации · 4/8
scenes:
  - type: title
    kicker: Коммерческие автоматизации · часть 4
    title: "Заменяем продажника: *заявка за минуту*"
    subtitle: Заявка с сайта, разбор моделью, CRM и менеджер, который не забудет.

  - type: list
    label: Что заменяем
    heading: Рутина, которую забирает система
    items:
      - "Заметить заявку: *карточка в чате за пару секунд*"
      - "Понять, что нужно: *модель пишет суть, бюджет и срок*"
      - "Решить, горячая ли: *метка температуры и спама*"
      - "Завести лид в CRM: *через две минуты, с разбором*"
      - "Договориться, кто берёт: *кнопка «Беру»*"
      - "Не забыть: *напоминание через 15 минут*"
    say: Звонить и продавать по-прежнему будет человек. Но начнёт через минуту после заявки, а не утром.

  - type: diagram
    label: Как устроено
    heading: Одна заявка, четыре задачи
    nodes:
      - { id: form, label: Форма на сайте, col: 0, row: 0, w: 3, step: 0 }
      - { id: job, label: site.form, sub: сохранить лид, col: 4, row: 0, w: 4, step: 1, accent: true }
      - { id: card, label: Карточка, sub: "Telegram, сразу", col: 0, row: 3, w: 3, step: 2 }
      - { id: claude, label: Claude, sub: суть и температура, col: 4, row: 3, w: 4, step: 2 }
      - { id: crm, label: CRM, sub: через 2 минуты, col: 9, row: 3, w: 3, step: 2 }
    edges:
      - { from: form, to: job }
      - { from: job, to: card }
      - { from: job, to: claude }
      - { from: job, to: crm }
      - { from: claude, to: card, label: обновляет }
    say: Карточка уходит до модели. Модель может не ответить, и заявка не должна из-за этого ждать.

  - type: list
    label: Форма
    heading: Публичная форма без капчи
    items:
      - "*Поле-ловушка*: боты заполняют всё подряд"
      - "*Лимит по IP*: пять заявок за десять минут"
      - "*Ограничение длины* каждого поля"
      - Обычная HTML-форма, без JavaScript и CORS

  - type: list
    label: Квалификация
    heading: Модель читает заявку как продажник
    items:
      - "*Структурированный ответ*: суть, услуга, бюджет, срок, температура, спам"
      - "*Описание бизнеса в промпте*: что для вас горячая заявка"
      - "*Текст заявки это данные*, а не инструкции"
      - "*Низкий effort*: разложить по полям быстро и дёшево"

  - type: statement
    label: Гонка
    text: Двое нажали «Беру» одновременно. *Один UPDATE с условием* отдаёт заявку одному.
    say: Второй видит «Кто-то успел раньше». Напоминание ничего не делает, если заявку уже взяли, так что отменять его не нужно.

  - type: list
    label: Проверено
    heading: Как это видит менеджер
    items:
      - Форма отправлена, карточка «Новая заявка» в чате
      - Через секунду карточка стала «Горячая» с бюджетом и сроком
      - Бот в ловушке не узнаёт, что его поймали
      - Через две минуты лид в CRM с разбором
      - Нажал «Беру», кнопки исчезли

  - type: end
    text: Около 400 строк поверх ядра. Дальше *заменяем бухгалтера*.
    url: balkhaev.com/blog/ru/automations-sales
