context: Коммерческие автоматизации · 1/8
scenes:
  - type: title
    kicker: Коммерческие автоматизации · часть 1
    title: "Концепция: какие автоматизации *окупаются*"
    subtitle: Как найти процессы, на которых бизнес теряет деньги, и решить, что автоматизировать первым.

  - type: list
    label: Пример
    heading: Типичная небольшая компания
    items:
      - Сайт с формой заявки
      - Менеджеры и CRM
      - Приём оплат через платёжный сервис
      - Поддержка в почте и Telegram
      - Руководитель, который хочет знать цифры

  - type: list
    label: Где утекают деньги
    heading: Пять мест, где бизнес теряет
    items:
      - "*Заявки ждут*: оставили вечером, менеджер увидел утром"
      - "*Оплаты теряются*: карта не прошла, счёт забыт"
      - "*Ручная выдача*: заплатил ночью, доступ получил утром"
      - "*Поддержка тонет* в однотипных вопросах"
      - "*Отчёты собирают руками*, а просадку замечают поздно"

  - type: list
    label: Как выбрать
    heading: Четыре вопроса к любой идее
    numbered: true
    items:
      - Как часто это происходит?
      - Сколько времени занимает у человека?
      - Сколько стоит задержка?
      - Сколько стоит ошибка?
    say: Первые три говорят, сколько автоматизация принесёт. Четвёртый говорит, насколько аккуратно её делать.

  - type: list
    label: Что построим
    heading: Каждая часть забирает рутину у одной роли
    items:
      - "*Заменяем продажника*: заявка у менеджера за минуту, с разбором"
      - "*Заменяем бухгалтера*: оплата, доступ и чек ровно один раз"
      - "*Заменяем поддержку*: модель пишет черновик, человек отправляет"
      - "*Заменяем аналитика*: утренняя сводка и тревоги"

  - type: compare
    label: Инструмент
    heading: No-code или свой код
    columns:
      - title: Zapier, Make, n8n
        points:
          - Короткая цепочка
          - Простая логика
          - Низкая цена ошибки
      - title: Свой код
        pick: true
        points:
          - Ветвления и ожидания
          - Деньги ровно один раз
          - Тесты и git
          - Модель с вашими промптами

  - type: diagram
    label: Архитектура
    heading: Один сервис на всё
    nodes:
      - { id: src, label: Источники, sub: "сайт, платёжка, почта, расписание", col: 0, row: 0, w: 4, step: 0 }
      - { id: intake, label: Приёмник, sub: "подпись, сохранить, 200", col: 0, row: 3, w: 4, step: 1 }
      - { id: db, label: Postgres, sub: события и очередь, col: 5, row: 3, w: 3, step: 2, accent: true }
      - { id: worker, label: Воркер, sub: выполняет и повторяет, col: 9, row: 3, w: 3, step: 3 }
      - { id: out, label: "Telegram, CRM, модель", col: 9, row: 0, w: 3, step: 4 }
    edges:
      - { from: src, to: intake }
      - { from: intake, to: db }
      - { from: db, to: worker }
      - { from: worker, to: out }
    say: Приёмник только сохраняет. Postgres служит и базой, и очередью. Воркер делает работу и при сбое повторяет.

  - type: list
    label: Принципы
    heading: Шесть правил цикла
    numbered: true
    items:
      - Сначала сохранить, потом обработать
      - Каждое действие идемпотентно
      - Сбои это норма
      - Человек там, где ошибка дорогая
      - Всё записано
      - Дёшево и скучно

  - type: end
    text: "Дальше строим *фундамент*: сервер, база и деплой по пушу."
    url: balkhaev.com/blog/ru/automations-concept
