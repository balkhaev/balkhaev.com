context: Company data · 3/7
scenes:
  - type: title
    kicker: Taming data · part 3
    title: "Everything in *one warehouse*"
    subtitle: Postgres 18 and dlt, no heavy platforms.

  - type: list
    label: Warehouse
    heading: A separate Postgres
    items:
      - "*Raw schemas*: copies as is"
      - "*core*: the one story"
      - "*marts*: for people and AI"
    say: Heavy reports shouldn't slow down the store, and a failed load shouldn't break working systems.

  - type: compare
    label: How to load
    heading: Changes or a window
    columns:
      - title: CRM and site
        pick: true
        points:
          - have a modified date
          - hourly, only new rows
          - merge by key
      - title: 1C
        points:
          - no modified date
          - nightly 60-day window
          - full reload monthly

  - type: statement
    label: A trap
    text: By default dlt *drops Cyrillic* from names.
    say: So the 1C load runs with SCHEMA__NAMING set to direct. Names stay exactly as in 1C.

  - type: diagram
    label: Schedule
    heading: One container with cron
    nodes:
      - { id: cron, label: cron, col: 0, row: 0, w: 3, step: 0 }
      - { id: dlt, label: dlt, sub: loading, col: 4, row: 0, w: 3, step: 1 }
      - { id: raw, label: Raw schemas, col: 8, row: 0, w: 4, step: 2 }
      - { id: dbt, label: dbt build, col: 8, row: 3, w: 4, step: 3 }
      - { id: tg, label: Telegram, sub: on failure, col: 3, row: 3, w: 4, step: 4, accent: true }
    edges:
      - { from: cron, to: dlt }
      - { from: dlt, to: raw }
      - { from: raw, to: dbt }
      - { from: dbt, to: tg }

  - type: end
    text: Next we *merge customers* into one.
    url: balkhaev.com/blog/data-ingest
