context: Дообучение · 4/7
scenes:
  - type: title
    kicker: Дообучение · часть 4
    title: "Оценка: стала ли модель *лучше*"
    subtitle: Честное сравнение на отложенном тесте.

  - type: compare
    label: Участники
    heading: Три модели, один тест
    columns:
      - title: База с промптом
        points:
          - что дало дообучение
      - title: Claude
        points:
          - текущая планка
      - title: Адаптер
        pick: true
        points:
          - кандидат

  - type: list
    label: Метрики
    heading: По каждому полю отдельно
    items:
      - "*Валидность* JSON"
      - "*Категория*: точность и полнота по каждой"
      - "*Срочные и нужен человек*: полнота важнее всего"
      - "*Таблица путаницы*: что с чем путается"
    say: Пропустить жалобу намного хуже, чем лишний раз позвать человека. Поэтому для дорогих ошибок главная метрика полнота.

  - type: statement
    label: Свободный текст
    text: "*Слепое попарное* сравнение, судья проверен руками."

  - type: diagram
    label: Разбор ошибок
    heading: Откуда берутся промахи
    nodes:
      - { id: err, label: Ошибка на тесте, col: 4, row: 0, w: 4, step: 0 }
      - { id: label, label: Ошибка разметки, col: 0, row: 3, w: 3, step: 1 }
      - { id: vague, label: Нечёткая граница, col: 3, row: 3, w: 3, step: 1 }
      - { id: gap, label: Мало примеров, col: 6, row: 3, w: 3, step: 1 }
      - { id: model, label: Слабая модель, col: 9, row: 3, w: 3, step: 2, accent: true }
    edges:
      - { from: err, to: label }
      - { from: err, to: vague }
      - { from: err, to: gap }
      - { from: err, to: model }
    say: Большинство ошибок объясняются данными. Чините данные, а не параметры обучения.

  - type: list
    label: Готовность
    heading: Правило решаем заранее
    items:
      - "Дорогие ошибки *не чаще*, чем в проде"
      - "Остальное *почти не хуже*"
      - "Странные входы *не ломают* ответ"
      - "Цена и задержка *заметно ниже*"

  - type: end
    text: Дальше доводка *DPO и GRPO*.
    url: balkhaev.com/blog/ru/finetune-eval
