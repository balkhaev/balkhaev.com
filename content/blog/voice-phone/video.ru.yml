context: Голосовой агент · 4/7
scenes:
  - type: title
    kicker: Голосовой агент · часть 4
    title: "Телефон: *SIP и перевод на человека*"
    subtitle: Без смены номера и без потерянных звонков.

  - type: diagram
    label: Путь звонка
    heading: От мобильного до агента
    nodes:
      - { id: ph, label: Клиент, col: 0, row: 0, w: 3, step: 0 }
      - { id: pbx, label: АТС компании, col: 4, row: 0, w: 4, step: 1 }
      - { id: sip, label: LiveKit SIP, sub: транк и правило, col: 9, row: 0, w: 3, step: 2 }
      - { id: room, label: Комната звонка, sub: клиент и агент, col: 5, row: 3, w: 5, step: 3, accent: true }
    edges:
      - { from: ph, to: pbx }
      - { from: pbx, to: sip }
      - { from: sip, to: room }

  - type: list
    label: Телефонный звук
    heading: Хуже браузерного
    items:
      - "Узкая полоса, *восемь килогерц*"
      - "Тестовые записи *только с телефона*"
      - "Словарь подсказок *важнее*"
      - "Цифры *переспрашивать*"

  - type: list
    label: Перевод
    heading: Как передать мастеру
    numbered: true
    items:
      - "Агент *решает* перевести"
      - "Мастер получает *пересказ*"
      - "Звонок *переводится*"
      - "Нет ответа: *перезвоним*"
    say: Мастер не должен спрашивать, что у вас случилось, после трёх минут объяснений.

  - type: statement
    label: Правило
    text: "«Соедините с человеком» работает *с первой секунды*."

  - type: list
    label: Запуск
    heading: С чего начать
    numbered: true
    items:
      - "*Вечер* и выходные"
      - "*Перегрузка* днём"
      - "*Ветка* меню"
      - "Агент *первым*"

  - type: end
    text: Дальше даём агенту *настоящие действия*.
    url: balkhaev.com/blog/ru/voice-phone
