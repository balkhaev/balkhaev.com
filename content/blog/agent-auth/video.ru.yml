context: Корпоративный AI-агент · 6/9
scenes:
  - type: title
    kicker: Корпоративный AI-агент · часть 6
    title: "Права доступа: агент *от имени сотрудника*"
    subtitle: SSO, обмен токенов, и вики с базой, которые сами отрезают лишнее.

  - type: list
    label: Почему не служебная учётка
    heading: «Не показывай зарплаты» в промпте не работает
    items:
      - "*Промпт не граница безопасности*: модель можно уговорить"
      - "*Промпт-инъекции*: документ может написать кто угодно"
      - "*Аудит*: все запросы от одной учётки, кто спрашивал, не узнать"
    say: Права проверяем не в модели, а там, где лежат данные. Модель может попросить что угодно, система отдаст только разрешённое.

  - type: diagram
    label: Схема
    heading: Токен сотрудника доходит до данных
    nodes:
      - { id: emp, label: Сотрудник, col: 0, row: 0, w: 3, step: 0 }
      - { id: sso, label: SSO, sub: "Keycloak, Entra ID, Okta", col: 0, row: 3, w: 3, step: 1 }
      - { id: agent, label: Агент, sub: меняет токен, col: 5, row: 0, w: 3, step: 2, accent: true }
      - { id: wiki, label: MCP вики, sub: фильтр по группам, col: 9, row: 2, w: 3, step: 3 }
      - { id: db, label: MCP база, sub: роли и RLS в Postgres, col: 9, row: 4, w: 3, step: 3 }
    edges:
      - { from: emp, to: sso, label: вход }
      - { from: sso, to: agent, both: true, label: обмен токенов }
      - { from: agent, to: wiki, label: aud=wiki }
      - { from: agent, to: db }
    say: Сотрудник входит через SSO. Перед вызовом сервера агент меняет токен на новый, выписанный только этому серверу и живущий пять минут.

  - type: list
    label: Токен
    heading: Три поля, на которых держится всё
    items:
      - "*sub*: кто это, чьи данные показывать и кого писать в журнал"
      - "*groups*: в каких группах человек, основа прав"
      - "*aud*: для кого выписан токен, чужой сервер его не примет"
    say: Пересылать один токен во все серверы опасно. Утечка одного токена открыла бы сразу все системы.

  - type: list
    label: Вики
    heading: Три детали фильтра по группам
    items:
      - "*Фильтр внутри поиска*, а не после: иначе пропадут разрешённые результаты"
      - "*Одинаковый ответ на «нет» и «нельзя»*: само название может быть секретом"
      - "*Сервер на каждый запрос*: права Игоря не перепутаются с правами Ольги"

  - type: statement
    label: База
    text: Модель пишет SQL сама, поэтому права проверяет *сам Postgres*, а не код вокруг запроса.
    say: Роли, права на колонки и row-level security. Менеджер видит свои сделки, колонку с окладом видит только HR.

  - type: list
    label: Атака
    heading: Мы атаковали свою защиту запросами модели
    items:
      - "Прочитать оклады напрямую: *нет прав на колонку*"
      - "Сбросить роль: *один оператор и INHERIT FALSE*"
      - "Переключить роль внутри SELECT: *свой логин на каждый уровень*"
      - "Подменить группы в настройке сессии: *контекст в таблице*"
      - "Изменить данные: *транзакция только на чтение*"
    say: Две дыры из шести нашлись в коде, который выглядел правильным. Держите набор атакующих запросов как тест.

  - type: statement
    label: Итог
    text: Код агента один. Разница между Игорем и Ольгой *только в токене*.
    say: В настоящей компании учебный SSO заменяется корпоративным, а почти весь код остаётся.

  - type: end
    text: Права есть. Дальше считаем *контекст и деньги*.
    url: balkhaev.com/blog/ru/agent-auth
