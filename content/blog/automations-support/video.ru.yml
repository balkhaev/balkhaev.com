context: Коммерческие автоматизации · 6/8
scenes:
  - type: title
    kicker: Коммерческие автоматизации · часть 6
    title: "Заменяем поддержку: *черновики ответов*"
    subtitle: Письма и сообщения превращаются в карточки с готовым ответом. Отправляет человек.

  - type: list
    label: Что заменяем
    heading: Всё, что до ответа
    items:
      - "Проверять почту: *карточка в чате через секунды*"
      - "Понять, о чём и насколько срочно: *категория и суть*"
      - "Найти клиента: *модель видит его заказы*"
      - "Написать ответ: *черновик по базе знаний*"
      - "Не забыть: *напоминание через час*"

  - type: list
    label: Почему черновик
    heading: Автоответ клиенту это плохая идея
    numbered: true
    items:
      - "*Модель ошибается уверенно*"
      - "*Проверка стоит одно нажатие*"
      - "*Входящее письмо может написать кто угодно*"
    say: Мы записываем, отправил ли человек черновик как есть. Через месяц видно, где черновики хороши.

  - type: diagram
    label: Как устроено
    heading: Карточка сразу, разбор следом
    nodes:
      - { id: in, label: Письмо или Telegram, col: 0, row: 0, w: 3, step: 0 }
      - { id: ticket, label: Обращение, sub: без дублей, col: 4, row: 0, w: 3, step: 1 }
      - { id: triage, label: Claude, sub: "категория, черновик", col: 8, row: 0, w: 4, step: 2 }
      - { id: kb, label: База знаний, sub: "kb/*.md, в кэше", col: 8, row: 3, w: 4, step: 2 }
      - { id: card, label: Карточка, sub: в чате поддержки, col: 4, row: 3, w: 3, step: 3, accent: true }
      - { id: human, label: Сотрудник, sub: отправляет, col: 0, row: 3, w: 3, step: 4 }
    edges:
      - { from: in, to: ticket }
      - { from: ticket, to: triage }
      - { from: kb, to: triage }
      - { from: triage, to: card, label: обновляет }
      - { from: card, to: human }
    say: Если модель не ответила, обращение не ждёт. Карточка уже в чате, разбор допишется, когда сможет.

  - type: list
    label: Правила разбора
    heading: Как модель пишет черновик
    items:
      - "*Только по базе знаний*: нет ответа, значит «нужен человек»"
      - "*Деньги, возвраты, жалобы* всегда с флагом"
      - "*Данные клиента это только его данные*"
      - "*Кэш промпта*: база знаний одинакова во всех запросах"

  - type: statement
    label: Ответ
    text: Одна кнопка «Отправить черновик» или *свой текст ответом на карточку*.
    say: Ответ уходит тем же каналом, отдельной задачей. Два сотрудника не ответят дважды.

  - type: statement
    label: Итог
    text: Клиенту *никогда не уходит то, чего не видел человек*.
    say: База знаний живёт в репозитории и правится обычным коммитом.

  - type: end
    text: Дальше последняя замена, *заменяем аналитика*.
    url: balkhaev.com/blog/ru/automations-support
