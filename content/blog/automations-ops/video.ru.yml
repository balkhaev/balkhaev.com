context: Коммерческие автоматизации · 8/8
scenes:
  - type: title
    kicker: Коммерческие автоматизации · часть 8
    title: "Эксплуатация: *мониторинг, бэкапы, секреты*"
    subtitle: Последняя часть цикла. Как узнать о сбое и пережить его.

  - type: list
    label: Что может пойти не так
    heading: И как мы об этом узнаем
    items:
      - "*Сервер упал*: внешняя проверка /health"
      - "*Воркер завис*: пинги через очередь перестали приходить"
      - "*Диск заполнился логами*: логи ограничены"
      - "*База потеряна*: ночной зашифрованный бэкап"
      - "*Утёк ключ*: ротация и минимальные права"
      - "*Выросли расходы на модель*: строка в сводке и тревога"

  - type: diagram
    label: Мониторинг
    heading: Сигнал снаружи, а не изнутри
    nodes:
      - { id: worker, label: Воркер, sub: пульс раз в 5 минут, col: 0, row: 0, w: 4, step: 0 }
      - { id: app, label: app, sub: /health, col: 0, row: 3, w: 4, step: 0 }
      - { id: hc, label: Healthchecks, sub: ждёт пингов, col: 5, row: 0, w: 3, step: 1 }
      - { id: uptime, label: Uptime-сервис, sub: раз в минуту, col: 5, row: 3, w: 3, step: 1 }
      - { id: tg, label: Telegram, sub: и почта, col: 9, row: 1, w: 3, step: 2, accent: true }
    edges:
      - { from: worker, to: hc, label: пинг }
      - { from: uptime, to: app, label: проверяет }
      - { from: hc, to: tg, label: нет пинга }
      - { from: uptime, to: tg }
    say: Тревоги из прошлой части выполняет сам воркер. Если он умер, их некому отправить. Поэтому пульс уходит наружу.

  - type: list
    label: Бэкапы
    heading: Три свойства настоящего бэкапа
    numbered: true
    items:
      - "*Лежит в другом месте*: хранилище другого провайдера"
      - "*Зашифрован*: закрытого ключа на сервере нет"
      - "*Его нельзя стереть с сервера*: ключ без права удаления"
    say: Бэкап, который ни разу не восстанавливали, это надежда, а не бэкап. Раз в месяц проверяем восстановление.

  - type: list
    label: Секреты
    heading: Правила для полутора десятков ключей
    items:
      - "Значения *только в .env на сервере*, список в .env.example"
      - "*Минимальные права* у каждого ключа"
      - "*Ротация*: новый ключ, перезапуск, отзыв старого"
      - "*Не в логах и не в текстах для модели*"

  - type: compare
    label: Стоимость
    heading: Сколько это стоит
    columns:
      - title: Инфраструктура
        points:
          - Одна небольшая VPS
          - 2 vCPU и 2–4 ГБ памяти
          - Плюс хранилище для бэкапов
      - title: Модель
        pick: true
        points:
          - Каждый запрос в журнале
          - Строка расходов в сводке
          - Лимит в консоли провайдера
          - Модель поменьше для сортировки

  - type: list
    label: Чек-лист
    heading: Ритм эксплуатации
    items:
      - "*Каждый день*: сводка и тревоги"
      - "*Раз в неделю*: обновления зависимостей"
      - "*Раз в месяц*: проверка восстановления, свежие образы"
      - "*Раз в квартал*: ключи, права, расходы"
      - "*Раз в год*: новая версия Postgres"

  - type: statement
    label: Итоги цикла
    text: Около *2200 строк* кода и SQL, без единого фреймворка, на одном сервере.
    say: Продажи, оплаты, поддержка и аналитика работают сами, а человек принимает решения там, где ошибка дорогая.

  - type: end
    text: Восемь частей, от идеи *до системы в проде*.
    url: balkhaev.com/blog/ru/automations-ops
