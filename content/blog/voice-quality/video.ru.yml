context: Голосовой агент · 6/7
scenes:
  - type: title
    kicker: Голосовой агент · часть 6
    title: "Качество: *не узнавать от клиентов*"
    subtitle: Симуляция звонков, метрики и разбор записей.

  - type: diagram
    label: Три слоя
    heading: Смотрим сверху вниз
    nodes:
      - { id: out, label: Исход, sub: решено и решено верно, col: 0, row: 0, w: 5, step: 0, accent: true }
      - { id: talk, label: Разговор, sub: задержка и перебивания, col: 7, row: 0, w: 5, step: 1 }
      - { id: asr, label: Распознавание, sub: важные слова, col: 4, row: 3, w: 5, step: 2 }
    edges:
      - { from: out, to: talk }
      - { from: talk, to: asr }

  - type: statement
    label: Главная метрика
    text: Запись в расписании *совпала* с договорённостью.
    say: Агент, который иногда записывает не на тот день, хуже агента, который чаще переводит на человека.

  - type: list
    label: Симуляция
    heading: Модель играет клиента
    items:
      - "Торопливый, *перебивает*"
      - "Пожилой, *говорит с паузами*"
      - "*Передумывает* посреди записи"
      - "Сразу *требует человека*"

  - type: compare
    label: Проверка
    heading: Два способа
    columns:
      - title: По расписанию
        pick: true
        points:
          - запись на то время
          - лишних записей нет
          - не ошибается
      - title: Судья-модель
        points:
          - подтвердил ли дату
          - короткие ли фразы
          - не обещал лишнего

  - type: statement
    label: Разбор
    text: Каждая новая ошибка становится *новым сценарием*.
    say: Раз в неделю слушаем двадцать записей и ставим каждой ошибке причину.

  - type: end
    text: Дальше выводим агента *в прод*.
    url: balkhaev.com/blog/ru/voice-quality
