context: Данные компании · 5/7
scenes:
  - type: title
    kicker: Укрощение данных · часть 5
    title: "Цифры, о которых *договорились*"
    subtitle: Метрики, словарь и проверки.

  - type: compare
    label: Почему цифры разные
    heading: Две выручки
    columns:
      - title: Коммерческий
        points:
          - сделки в CRM
          - с НДС
          - без возвратов
      - title: Финансовый
        pick: true
        points:
          - отгрузки в 1С
          - без НДС
          - минус возвраты

  - type: list
    label: Договорённость
    heading: Для каждой метрики
    items:
      - "Одно *письменное определение*"
      - "*Владелец*, который решает споры"
      - "Что в неё *не входит*"
    say: Если людям нужны разные цифры, это две метрики с разными именами.

  - type: list
    label: Проверки
    heading: Четыре вида
    items:
      - "*Целостность*: дубли и потерянные связи"
      - "*Свежесть* загрузок"
      - "*Правдоподобие*: ноль или всплеск"
      - "*Сверка* с бухгалтерией"

  - type: statement
    label: При сбое
    text: Лучше *вчерашние правильные* цифры, чем сегодняшние сломанные.
    say: Если проверка упала, витрины не обновляются, а в Telegram приходит, что и где сломалось.

  - type: end
    text: Дальше сажаем сверху *ИИ-помощника*.
    url: balkhaev.com/blog/ru/data-metrics
