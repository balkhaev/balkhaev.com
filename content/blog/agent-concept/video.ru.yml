context: Корпоративный AI-агент · 1/9
scenes:
  - type: title
    kicker: Корпоративный AI-агент · часть 1
    title: "Концепция: агент, который *знает компанию*"
    subtitle: Что за агента мы строим и из каких частей он состоит.

  - type: list
    label: Задача
    heading: Ответы в компании есть. Их долго искать.
    items:
      - "Условия оплаты по договору: в *вики* или на диске"
      - "Почему вчера упала оплата: в *трекере* и чате дежурных"
      - "Продажи за октябрь по регионам: в *базе данных*"
    say: Найти ответ значит знать, где искать, иметь доступ и потратить полчаса. Или отнять полчаса у коллеги.

  - type: statement
    label: Цель
    text: Спросить обычным языком и получить ответ *со ссылками на источники*.
    say: Причём разработчик не увидит зарплаты, а стажёр договор, к которому у него нет доступа.

  - type: compare
    label: Три пути
    heading: Почему не чат-бот и не дообучение
    columns:
      - title: Обычный чат-бот
        points:
          - Не знает ваших данных
          - Знания устаревают
          - Отвечает всем обо всём
      - title: Дообучение
        points:
          - Путает факты и цифры
          - Знания застывают
          - Права не соблюсти
          - Нет источника ответа
      - title: Агент с инструментами
        pick: true
        points:
          - Ищет в момент вопроса
          - Данные всегда свежие
          - Права при каждом запросе
          - Ответ со ссылками
    say: Работает третий путь. Модель ничего не знает заранее, но умеет искать.

  - type: diagram
    label: Архитектура
    heading: Из чего состоит агент
    nodes:
      - { id: user, label: Сотрудник, sub: "Slack, веб-чат", col: 0, row: 0, w: 3, step: 0 }
      - { id: harness, label: Наш сервис, sub: "история, цикл, журнал", col: 4, row: 0, w: 4, step: 1, accent: true }
      - { id: model, label: Модель по API, sub: Claude, col: 9, row: 0, w: 3, step: 2 }
      - { id: docs, label: Документы, sub: поиск по вики, col: 0, row: 4, w: 3, step: 3 }
      - { id: db, label: База данных, sub: только чтение, col: 3, row: 4, w: 2, step: 3 }
      - { id: tracker, label: Трекер, sub: задачи, col: 5, row: 4, w: 2, step: 3 }
      - { id: crm, label: CRM, sub: клиенты, col: 7, row: 4, w: 2, step: 3 }
      - { id: git, label: Git, sub: код, col: 9, row: 4, w: 3, step: 3 }
    edges:
      - { from: user, to: harness, label: вопрос }
      - { from: harness, to: model, both: true }
      - { from: harness, to: docs }
      - { from: harness, to: db }
      - { from: harness, to: tracker, label: MCP + токен сотрудника }
      - { from: harness, to: crm }
      - { from: harness, to: git }
    say: Сервис ведёт разговор и крутит цикл. Модель выбирает инструменты. Каждая система подключается своим MCP-сервером.

  - type: list
    label: Слои
    heading: За что отвечает каждая часть
    items:
      - "*Модель*: понимает вопрос, выбирает инструменты, пишет ответ. Её легко заменить"
      - "*Сервис*: история, агентный цикл, лимиты шагов и расходов, журнал"
      - "*MCP*: каждая система подключается отдельным сервером"
      - "*Поиск*: единственное место, где копируем данные, вместе с правами"
      - "*Личность*: вход через SSO, агент ходит в системы от имени сотрудника"
      - "*Интерфейс*: бот в мессенджере и веб-чат, тонкий слой"

  - type: statement
    label: Самое важное
    text: Агент видит *то же, что и спрашивающий*. И не больше.
    say: Никакой служебной учётки с доступом ко всему. Если у человека нет доступа к документу, агент его тоже не увидит.

  - type: list
    label: Принципы
    heading: Шесть правил, которых держимся
    numbered: true
    items:
      - Модель покупаем, знания подаём через инструменты
      - Данные остаются на месте
      - Агент действует от имени человека
      - По умолчанию только чтение
      - Каждый ответ со ссылками на источники
      - Всё записываем

  - type: statement
    label: Данные у провайдера
    text: Вопросы и найденные фрагменты *уходят провайдеру* модели.
    say: Коммерческие API по умолчанию не обучаются на запросах клиентов, но условия надо прочитать. Нужен свой регион? Bedrock или Vertex AI.

  - type: list
    label: План цикла
    heading: Девять частей, каждая на фундаменте прошлой
    numbered: true
    items:
      - Концепция
      - Первый разговор с моделью
      - Агентный цикл и инструменты
      - MCP
      - Знания компании
      - Права доступа
      - Контекст и деньги
      - Интерфейс
      - В прод

  - type: end
    text: Дальше пишем код. Слой за слоем, *до прода*.
    url: balkhaev.com/blog/ru/agent-concept
