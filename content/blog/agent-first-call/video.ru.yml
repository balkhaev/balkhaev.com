context: Корпоративный AI-агент · 2/9
scenes:
  - type: title
    kicker: Корпоративный AI-агент · часть 2
    title: Первый разговор *с моделью*
    subtitle: Ключ API, SDK и чат в терминале со стримингом и историей.

  - type: list
    label: Что такое агент
    heading: Три части, если убрать маркетинг
    items:
      - "*Модель*: по тексту решает, что делать дальше"
      - "*Инструменты*: функции в вашем коде, которые модель просит вызвать"
      - "*Цикл (harness)*: передаёт историю, выполняет инструменты, повторяет"
    say: Модель самая дорогая и самая заменяемая часть. Всё интересное происходит в цикле, и его мы напишем сами.

  - type: list
    label: Подготовка
    heading: С чего начать
    numbered: true
    items:
      - Зарегистрироваться в консоли провайдера и пополнить баланс
      - Создать API-ключ
      - "Положить ключ в *переменную окружения*, не в код и не в git"
      - Поставить официальный SDK

  - type: compare
    label: Ответ модели
    heading: На что смотреть в каждом ответе
    columns:
      - title: content
        points:
          - Массив блоков, не строка
          - Текст, размышления
          - Вызовы инструментов
      - title: stop_reason
        points:
          - end_turn, договорила
          - max_tokens, упёрлась
          - tool_use, хочет инструмент
      - title: usage
        pick: true
        points:
          - Токены на входе
          - Токены на выходе
          - По ним считаются деньги

  - type: statement
    label: История
    text: API *не хранит разговор*. Каждый запрос несёт всю историю целиком.
    say: Память модели это просто массив сообщений, который вы растите сами. Поэтому каждый следующий запрос дороже предыдущего.

  - type: diagram
    label: Чат
    heading: Как устроен чат в терминале
    nodes:
      - { id: user, label: Вы, sub: строка в терминале, col: 0, row: 1, w: 3, step: 0 }
      - { id: history, label: История, sub: массив messages, col: 4, row: 1, w: 4, step: 1, accent: true }
      - { id: model, label: Модель, sub: стримит ответ, col: 9, row: 1, w: 3, step: 2 }
      - { id: usage, label: Счётчик токенов, sub: после каждого ответа, col: 4, row: 4, w: 4, step: 3 }
    edges:
      - { from: user, to: history, label: вопрос }
      - { from: history, to: model, both: true, label: весь разговор }
      - { from: history, to: usage }
    say: Около сорока строк. Текст печатается по мере генерации, а полный ответ целиком уходит обратно в историю.

  - type: list
    label: Разбор
    heading: Четыре настройки, которые важны
    items:
      - "*system*: роль и правила, инструкция от разработчика"
      - "*effort*: насколько глубоко модель думает перед ответом"
      - "*Ответ целиком в историю*: со служебными блоками, иначе агент сломается"
      - "*max_tokens*: потолок длины ответа, а не цель"

  - type: end
    text: Модель умеет говорить. Дальше дадим ей *руки*.
    url: balkhaev.com/blog/ru/agent-first-call
