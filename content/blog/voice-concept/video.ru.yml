context: Голосовой агент · 1/7
scenes:
  - type: title
    kicker: Голосовой агент · часть 1
    title: "ИИ берёт *трубку*"
    subtitle: Где голосовой агент окупается и почему всё решает задержка.

  - type: list
    label: Звонки автосервиса
    heading: Четыре из пяти однотипны
    items:
      - "*Записаться* на ТО или ремонт"
      - "*Перенести* или отменить"
      - "*Готова ли* машина"
      - "*Адрес*, часы, цена"
    say: Для ответа нужен не опыт мастера, а быстрый доступ к расписанию и заказ-нарядам.

  - type: compare
    label: Архитектура
    heading: Каскад или речь-в-речь
    columns:
      - title: Каскад
        pick: true
        points:
          - каждое звено заменяется
          - надёжные инструменты
          - текстовый журнал из коробки
      - title: Речь-в-речь
        points:
          - быстрее и естественнее
          - голоса провайдера
          - меняется только целиком

  - type: diagram
    label: Бюджет задержки
    heading: Секунда на всё
    nodes:
      - { id: eou, label: Конец фразы, sub: 200–400 мс, col: 0, row: 0, w: 4, step: 0 }
      - { id: asr, label: Распознавание, sub: 50–150 мс, col: 4, row: 0, w: 4, step: 1 }
      - { id: llm, label: Модель, sub: 250–500 мс, col: 8, row: 0, w: 4, step: 2, accent: true }
      - { id: tts, label: Синтез, sub: 80–200 мс, col: 8, row: 3, w: 4, step: 3 }
      - { id: net, label: Сеть и телефон, sub: 100–200 мс, col: 4, row: 3, w: 4, step: 4 }
    edges:
      - { from: eou, to: asr }
      - { from: asr, to: llm }
      - { from: llm, to: tts }
      - { from: tts, to: net }

  - type: statement
    label: Главное
    text: Пауза дольше секунды *ломает разговор*.
    say: Поэтому в голосе работают быстрые модели, короткие промпты и потоковая передача на каждом шаге.

  - type: list
    label: Принципы
    heading: Как держимся
    items:
      - "Честно *представляется*"
      - "Человек *в одной фразе*"
      - "Подтверждение *перед действием*"
      - "Задержка это *бюджет*"

  - type: end
    text: Дальше собираем *каскад*.
    url: balkhaev.com/blog/ru/voice-concept
