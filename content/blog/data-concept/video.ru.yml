context: Данные компании · 1/7
scenes:
  - type: title
    kicker: Укрощение данных · часть 1
    title: "Одна картина вместо *пяти систем*"
    subtitle: Почему данные расползаются и что с этим делать.

  - type: list
    label: Где живут данные
    heading: Везде понемногу
    items:
      - "*1С*: заказы, отгрузки, оплаты"
      - "*CRM*: сделки и менеджеры"
      - "*Сайт*: заказы магазина"
      - "*Таблицы*: план и ключевые клиенты"
    say: Каждая система по отдельности работает. Проблемы начинаются, когда ответ требует двух систем сразу.

  - type: list
    label: Симптомы
    heading: Как узнать хаос
    items:
      - "Разные цифры *на одной планёрке*"
      - "Один клиент *в пяти местах*"
      - "Отчёт *за три дня* в Excel"
      - "ИИ-помощник *уверенно врёт*"

  - type: compare
    label: Что делать
    heading: Не заменять, а собирать
    columns:
      - title: Одна новая система
        points:
          - дорого и долго
          - отделы не уйдут из своих
          - через год снова таблицы
      - title: Одна картина сверху
        pick: true
        points:
          - системы остаются
          - данные копируются в хранилище
          - там сводятся в одну историю

  - type: diagram
    label: Слои
    heading: Из чего состоит картина
    nodes:
      - { id: src, label: Источники, col: 0, row: 0, w: 3, step: 0 }
      - { id: raw, label: Сырые копии, col: 4, row: 0, w: 3, step: 1 }
      - { id: core, label: Одна история, sub: клиенты и заказы, col: 8, row: 0, w: 4, step: 2, accent: true }
      - { id: met, label: Цифры, sub: метрики и словарь, col: 8, row: 3, w: 4, step: 3 }
      - { id: use, label: ИИ и автоматизации, col: 3, row: 3, w: 4, step: 4 }
    edges:
      - { from: src, to: raw }
      - { from: raw, to: core }
      - { from: core, to: met }
      - { from: met, to: use }

  - type: statement
    label: Главное
    text: ИИ ставим *сверху*, а не вместо середины.
    say: Если в данных три Ромашки и две выручки, модель выберет одну, и каждый день разную.

  - type: end
    text: Дальше составляем *карту источников*.
    url: balkhaev.com/blog/ru/data-concept
