name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'deploy-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build

  # Post videos: storyboards (content/blog/*/video.*.yml) are rendered with
  # HyperFrames into /srv/balkhaev-video on the server, only those whose hash
  # changed, one job per video. scripts/deploy.ts bakes them into the image.
  video-plan:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      todo: ${{ steps.plan.outputs.todo }}
      refs: ${{ steps.plan.outputs.refs }}
      voice: ${{ steps.plan.outputs.voice }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: scripts/ci-ssh.sh
      - id: plan
        run: |
          ssh -o BatchMode=yes root@49.13.216.63 'mkdir -p /srv/balkhaev-video && cd /srv/balkhaev-video && grep -r . --include=*.hash || true' > have.txt
          todo=$(bun scripts/video.ts --plan have.txt)
          echo "todo=$todo" >> "$GITHUB_OUTPUT"
          echo "$todo"
          # Narrator reference recordings still to make, for the languages
          # that have voiced videos to render.
          voice=$(bun -e 'import { VOICE_VERSION } from "./src/video/voice"; console.log(VOICE_VERSION)')
          ssh -o BatchMode=yes root@49.13.216.63 "ls /srv/balkhaev-video/voice/$voice 2>/dev/null || true" > refs.txt
          refs=$(echo "$todo" | bun -e 'const todo = JSON.parse(await Bun.stdin.text()); const have = (await Bun.file("refs.txt").text()).split("\n"); console.log(JSON.stringify([...new Set(todo.filter((job) => job.voiced).map((job) => job.lang))].filter((lang) => !have.includes(`${lang}.wav`))))')
          echo "voice=$voice" >> "$GITHUB_OUTPUT"
          echo "refs=$refs" >> "$GITHUB_OUTPUT"
          echo "voice $voice, references to make: $refs"

  voice-ref:
    needs: video-plan
    if: needs.video-plan.outputs.refs != '[]' && needs.video-plan.outputs.refs != ''
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    strategy:
      matrix:
        lang: ${{ fromJSON(needs.video-plan.outputs.refs) }}
    name: voice reference ${{ matrix.lang }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-voice-design-${{ needs.video-plan.outputs.voice }}
      - run: scripts/ci-voice-deps.sh
      - run: bun scripts/video.ts --voice-ref ${{ matrix.lang }}
        env:
          VOICE_DIR: voice-ref
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: scripts/ci-ssh.sh
      - name: Upload to the server
        run: |
          dir=/srv/balkhaev-video/voice/${{ needs.video-plan.outputs.voice }}
          ssh -o BatchMode=yes root@49.13.216.63 "mkdir -p $dir"
          scp -o BatchMode=yes voice-ref/${{ matrix.lang }}.wav root@49.13.216.63:$dir/

  video:
    needs: [video-plan, voice-ref]
    # voice-ref is skipped when the references already exist.
    if: >-
      always() && needs.video-plan.result == 'success' &&
      needs.video-plan.outputs.todo != '[]' &&
      needs.voice-ref.result != 'failure' && needs.voice-ref.result != 'cancelled'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include: ${{ fromJSON(needs.video-plan.outputs.todo) }}
    name: video ${{ matrix.slug }} ${{ matrix.lang }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npx --yes hyperframes@0.9.11 telemetry disable || true
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: scripts/ci-ssh.sh
      - if: matrix.voiced
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: matrix.voiced
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-voice-base-${{ needs.video-plan.outputs.voice }}
      - if: matrix.voiced
        name: Voice
        run: |
          scripts/ci-voice-deps.sh
          mkdir -p .video/voice
          scp -o BatchMode=yes root@49.13.216.63:/srv/balkhaev-video/voice/${{ needs.video-plan.outputs.voice }}/${{ matrix.lang }}.wav .video/voice/
      - run: bun scripts/video.ts ${{ matrix.slug }} --lang ${{ matrix.lang }}
      - name: Upload to the server
        run: |
          dir=/srv/balkhaev-video/${{ matrix.slug }}
          ssh -o BatchMode=yes root@49.13.216.63 "mkdir -p $dir"
          # The hash goes last, so a half-uploaded video is rendered again.
          scp -o BatchMode=yes video/${{ matrix.slug }}/${{ matrix.lang }}.mp4 video/${{ matrix.slug }}/${{ matrix.lang }}.jpg video/${{ matrix.slug }}/${{ matrix.lang }}.json root@49.13.216.63:$dir/
          scp -o BatchMode=yes video/${{ matrix.slug }}/${{ matrix.lang }}.hash root@49.13.216.63:$dir/

  deploy:
    needs: [check, video]
    # Runs when there was nothing to render, too; a failed video only leaves
    # that post without a player.
    if: >-
      always() && needs.check.result == 'success' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://balkhaev.com
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          COOLIFY_ACCESS_TOKEN: ${{ secrets.COOLIFY_ACCESS_TOKEN }}
        run: |
          if [ -z "$COOLIFY_ACCESS_TOKEN" ]; then
            echo "::error::Add the COOLIFY_ACCESS_TOKEN secret to the production environment"
            exit 1
          fi
          scripts/ci-ssh.sh
      - name: Deploy
        env:
          COOLIFY_ACCESS_TOKEN: ${{ secrets.COOLIFY_ACCESS_TOKEN }}
        run: bun run deploy
      - name: Smoke test
        run: |
          for path in / /cv/ /blog/ /blog/ru/ /sitemap.xml /news/feed.json /blog/news.js; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://balkhaev.com$path")
            echo "$path $code"
            [ "$code" = 200 ] || exit 1
          done
          curl -sf https://balkhaev.com/ | grep -q 'href="/blog/ru/"'
