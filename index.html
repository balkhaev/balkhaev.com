<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <meta content="#000000" name="theme-color">
    <meta content="Balkhaev. Погружение в чёрную дыру." name="description">
    <meta content="Balkhaev" property="og:title">
    <meta content="Погружение в чёрную дыру." property="og:description">
    <meta content="https://balkhaev.com/" property="og:url">
    <meta content="website" property="og:type">
    <link href="https://balkhaev.com/" rel="canonical">
    <link href="/icon.svg" rel="icon" type="image/svg+xml">
    <link href="/style.css" rel="stylesheet">
    <title>Balkhaev</title>
  </head>
  <body>
    <main aria-label="Balkhaev">
      <div aria-hidden="true" class="fallback"></div>
      <canvas aria-hidden="true" id="hole"></canvas>
      <button
        aria-label="Проведите мышью по диску, чтобы оставить волны. Нажмите на диск для всплеска. Потяните мышью или используйте стрелки, чтобы оглядеться. Скролл вниз, разведение пальцев или плюс — продолжить падение. Скролл вверх, сведение пальцев или минус — перемотать полёт назад и остановиться. Это просмотр траектории во времени, доступный и за горизонтом. Tab — контакты."
        id="observer"
        type="button"
      ></button>
      <header class="masthead">
        <h1>balkhaev<span aria-hidden="true">.</span></h1>
        <nav aria-label="Связаться" class="contacts">
          <a
            href="https://t.me/balkhaev"
            rel="noopener noreferrer"
            target="_blank"
          >
            Telegram <span aria-hidden="true">↗</span>
          </a>
          <a href="mailto:m.balkhaev@gmail.com">
            Почта <span aria-hidden="true">↗</span>
          </a>
        </nav>
      </header>
      <footer class="flight-info">
        <p aria-hidden="true" id="hint">
          <span class="scroll-mark"></span>
          <span
            ><span class="hint-desktop"
              >Мышь — волны<span class="hint-divider">/</span>Потяните — обзор<span
                class="hint-divider"
                >/</span
              >Скролл ↓ — падение · ↑ — перемотка</span
            ><span class="hint-touch"
              >Коснитесь — волны · Потяните — обзор · Щипок — время полёта</span
            ></span
          >
        </p>
        <div class="flight-state">
          <span aria-live="polite" id="flight-status"></span>
          <p id="flight-note"></p>
        </div>
      </footer>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
