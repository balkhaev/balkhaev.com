<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta
      content="width=device-width, initial-scale=1, viewport-fit=cover"
      name="viewport"
    >
    <meta content="noindex, nofollow, noarchive" name="robots">
    <meta content="no-referrer" name="referrer">
    <title>Русс-маркет · карта систем</title>
    <link href="/icon.svg" rel="icon">
    <link
      href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    >
    <style>
    [hidden] {
      display: none !important;
    }
    /* Layout: узкая колонка чтения + липкое оглавление слева на широких экранах; каждая схема — отдельный блок с бейджем источника */
    :root {
      --bg: #f6f7f8;
      --surface: #ffffff;
      --fg: #16202a;
      --muted: #5b6875;
      --line: #dde2e7;
      --accent: #1f5f8b;
      --accent-soft: #e4eef6;
      --ok: #1f7a4d;
      --ok-soft: #e2f3ea;
      --warn: #9a5b00;
      --warn-soft: #fbf0dc;
      --font-body:
        "Golos Text", "Segoe UI", system-ui, -apple-system, sans-serif;
      --font-mono:
        "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #11161b;
        --surface: #182029;
        --fg: #e3e8ed;
        --muted: #97a4b1;
        --line: #2a3541;
        --accent: #7db6e0;
        --accent-soft: #1c2c3a;
        --ok: #6fcf9c;
        --ok-soft: #173125;
        --warn: #e8b35c;
        --warn-soft: #362812;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #11161b;
      --surface: #182029;
      --fg: #e3e8ed;
      --muted: #97a4b1;
      --line: #2a3541;
      --accent: #7db6e0;
      --accent-soft: #1c2c3a;
      --ok: #6fcf9c;
      --ok-soft: #173125;
      --warn: #e8b35c;
      --warn-soft: #362812;
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      padding-block: 32px 64px;
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.55;
      color: var(--fg);
      background: var(--bg);
    }
    .wrap {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      gap: 40px;
      max-width: 1180px;
      margin: 0 auto;
    }
    nav.toc {
      position: sticky;
      top: calc(env(safe-area-inset-top, 0px) + 24px);
      align-self: start;
      font-size: 13.5px;
    }
    nav.toc .lbl {
      margin-bottom: 10px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    nav.toc ol {
      display: grid;
      gap: 2px;
      padding: 0;
      margin: 0;
      list-style: none;
      counter-reset: s;
    }
    nav.toc li {
      counter-increment: s;
    }
    nav.toc a {
      display: flex;
      gap: 8px;
      padding: 5px 8px;
      color: var(--fg);
      text-decoration: none;
      border-radius: 6px;
    }
    nav.toc a::before {
      padding-top: 2px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      content: counter(s, decimal-leading-zero);
    }
    nav.toc a:hover,
    nav.toc a:focus-visible {
      outline: none;
      background: var(--accent-soft);
    }
    main {
      display: grid;
      gap: 48px;
      min-width: 0;
    }
    header h1 {
      margin: 0 0 12px;
      font-size: 30px;
      font-weight: 700;
      line-height: 1.2;
      text-wrap: balance;
    }
    header p {
      max-width: 70ch;
      margin: 0 0 10px;
      color: var(--muted);
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      margin-top: 16px;
      font-size: 13.5px;
    }
    .legend span {
      display: inline-flex;
      gap: 8px;
      align-items: center;
    }
    .badge {
      padding: 3px 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.04em;
      white-space: nowrap;
      border-radius: 4px;
    }
    .badge.doc {
      color: var(--ok);
      background: var(--ok-soft);
    }
    .badge.hyp {
      color: var(--warn);
      background: var(--warn-soft);
    }
    section {
      scroll-margin-top: 24px;
    }
    section h2 {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin: 0 0 6px;
      font-size: 21px;
      text-wrap: balance;
    }
    section h2 .num {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
    }
    section > p {
      max-width: 72ch;
      margin: 0 0 14px;
    }
    .src {
      margin-top: 10px;
      font-size: 12.5px;
      color: var(--muted);
    }
    :is(.src, p, td, li) code {
      padding: 1px 5px;
      font-family: var(--font-mono);
      font-size: 0.88em;
      background: var(--accent-soft);
      border-radius: 4px;
    }
    .diagram {
      padding: 20px;
      overflow-x: auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .diagram pre.mermaid {
      display: flex;
      justify-content: center;
      min-width: min-content;
      margin: 0;
      background: transparent;
    }
    .tbl {
      overflow-x: auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    table {
      width: 100%;
      font-size: 14px;
      border-collapse: collapse;
    }
    th,
    td {
      padding: 10px 14px;
      vertical-align: top;
      text-align: left;
      border-bottom: 1px solid var(--line);
    }
    th {
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    tr:last-child td {
      border-bottom: 0;
    }
    .qs {
      display: grid;
      gap: 8px;
      max-width: 75ch;
      padding-left: 20px;
      margin: 0;
    }
    .points {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .pt {
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .pt b {
      display: block;
      font-weight: 600;
    }
    .pt span {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--muted);
    }
    @media (max-width: 860px) {
      .wrap {
        grid-template-columns: minmax(0, 1fr);
        gap: 24px;
      }
      nav.toc {
        position: static;
      }
      nav.toc ol {
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      }
      header h1 {
        font-size: 25px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }
    html {
      scroll-behavior: smooth;
    }
    </style>
    <style>
    .eyebrow {
      margin-bottom: 10px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .group {
      display: flex;
      gap: 14px;
      align-items: center;
      margin-top: 8px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .group::after {
      flex: 1;
      height: 1px;
      content: "";
      background: var(--line);
    }
    nav.toc {
      max-height: calc(100vh - 48px);
      overflow-y: auto;
    }
    nav.toc .lbl {
      margin-top: 18px;
    }
    nav.toc .lbl:first-child {
      margin-top: 0;
    }
    section a {
      color: var(--accent);
    }
    .gate {
      display: grid;
      place-items: center;
      min-height: 80vh;
    }
    .gate form {
      display: grid;
      gap: 14px;
      width: 100%;
      max-width: 380px;
      padding: 28px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .gate h1 {
      margin: 0;
      font-size: 22px;
    }
    .gate p {
      margin: 0;
      font-size: 14px;
      color: var(--muted);
    }
    .gate input {
      padding: 10px 12px;
      font: inherit;
      color: var(--fg);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .gate input:focus-visible,
    .gate button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .gate button {
      padding: 10px 12px;
      font: inherit;
      font-weight: 600;
      color: var(--surface);
      cursor: pointer;
      background: var(--accent);
      border: 0;
      border-radius: 8px;
    }
    .gate button[disabled] {
      cursor: progress;
      opacity: 0.6;
    }
    .gate .err {
      min-height: 1.2em;
      font-size: 13.5px;
      color: var(--warn);
    }
    main > section,
    main > header,
    main > .group {
      min-width: 0;
    }
    @media (max-width: 860px) {
      nav.toc {
        max-height: 45vh;
        padding: 12px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
    }
    </style>
  </head>
  <body>
    <div class="gate" id="gate">
      <form autocomplete="off" id="gate-form">
        <h1>Русс-маркет</h1>
        <p>Внутренняя карта процессов и систем. Введите пароль.</p>
        <input
          aria-label="Пароль"
          autofocus
          id="pw"
          name="pw"
          placeholder="Пароль"
          required
          type="password"
        >
        <button id="go" type="submit">Открыть</button>
        <div class="err" id="err" role="alert"></div>
      </form>
    </div>
    <div hidden id="app"></div>
    <script>
    "use strict";
    (() => {
      const KEY = "russ-pw";
      const form = document.getElementById("gate-form");
      const input = document.getElementById("pw");
      const btn = document.getElementById("go");
      const err = document.getElementById("err");
      const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
      let payload;
      const loadPayload = async () => {
        if (!payload) {
          const r = await fetch("/russ/payload.txt", { cache: "no-store" });
          if (!r.ok) {
            throw new Error("payload");
          }
          payload = await r.json();
        }
        return payload;
      };
      const decrypt = async (pw) => {
        const p = await loadPayload();
        const base = await crypto.subtle.importKey(
          "raw",
          new TextEncoder().encode(pw),
          "PBKDF2",
          false,
          ["deriveKey"]
        );
        const key = await crypto.subtle.deriveKey(
          { hash: "SHA-256", iterations: p.n, name: "PBKDF2", salt: b64(p.s) },
          base,
          { length: 256, name: "AES-GCM" },
          false,
          ["decrypt"]
        );
        const plain = await crypto.subtle.decrypt(
          { iv: b64(p.i), name: "AES-GCM" },
          key,
          b64(p.c)
        );
        return new TextDecoder().decode(plain);
      };
      const dark = () => {
        const t = document.documentElement.dataset.theme;
        return t
          ? t === "dark"
          : matchMedia("(prefers-color-scheme: dark)").matches;
      };
      const renderDiagrams = () => {
        const s = document.createElement("script");
        s.src =
          "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js";
        s.onload = () => {
          window.mermaid.initialize({
            fontFamily: "Golos Text, system-ui, sans-serif",
            securityLevel: "strict",
            startOnLoad: false,
            theme: dark() ? "dark" : "neutral",
          });
          window.mermaid.run({ querySelector: "pre.mermaid" });
        };
        document.head.appendChild(s);
      };
      const open = (html) => {
        const app = document.getElementById("app");
        app.innerHTML = html;
        document.getElementById("gate").hidden = true;
        app.hidden = false;
        renderDiagrams();
        if (location.hash) {
          const el = document.getElementById(location.hash.slice(1));
          if (el) {
            el.scrollIntoView();
          }
        }
      };
      const attempt = async (pw, silent) => {
        btn.disabled = true;
        err.textContent = "";
        try {
          const html = await decrypt(pw);
          try {
            sessionStorage.setItem(KEY, pw);
          } catch {
            // storage unavailable: the page still works without it
          }
          open(html);
        } catch (e) {
          try {
            sessionStorage.removeItem(KEY);
          } catch {
            // storage unavailable: the page still works without it
          }
          if (!silent) {
            err.textContent =
              e.message === "payload"
                ? "Не удалось загрузить страницу, обновите её."
                : "Неверный пароль.";
          }
        } finally {
          btn.disabled = false;
        }
      };
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        attempt(input.value, false);
      });
      let saved = null;
      try {
        saved = sessionStorage.getItem(KEY);
      } catch {
        // storage unavailable: the page still works without it
      }
      if (saved) {
        attempt(saved, true);
      }
    })();
    </script>
  </body>
</html>
